<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Bebas+Neue&family=Montserrat:wght@400;800&family=Comic+Neue:wght@700&family=Roboto:wght@700;900&family=Open+Sans:wght@700;800&family=Oswald:wght@700&family=Raleway:wght@800;900&family=Nunito:wght@800;900&family=Playfair+Display:wght@700;900&family=Caveat:wght@700&family=Rubik:wght@700;900&family=Pacifico&family=Yanone+Kaffeesatz:wght@700&family=Comfortaa:wght@700&family=Ruslan+Display&family=Kelly+Slab&family=Roboto+Slab:wght@700;900&family=Lobster&family=Alice&family=PT+Sans:wght@700&display=swap');
        
        body { 
            background-color: transparent; 
            color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            margin: 0;
            padding: 0;
        }

        .drag-region { -webkit-app-region: drag; user-select: none; }
        .no-drag { -webkit-app-region: no-drag; }

        @keyframes floatUpFade { 
            0% { transform: translate(-50%, 50px) scale(0.5); opacity: 0; } 
            15% { transform: translate(-50%, -10px) scale(1.2); opacity: 1; } 
            80% { transform: translate(-50%, -60px) scale(1); opacity: 1; } 
            100% { transform: translate(-50%, -100px) scale(0.8); opacity: 0; } 
        }
        .float-up-anim { 
            animation: floatUpFade 2s ease-out forwards; 
            position: absolute; 
            left: 50%; 
            will-change: transform, opacity;
        }

        @keyframes bonusPop { 
            0% { transform: scale(0.5); opacity: 0; filter: blur(10px); } 
            60% { transform: scale(1.1); opacity: 1; filter: blur(0px); } 
            100% { transform: scale(1); opacity: 1; filter: blur(0px); } 
        }
        .bonus-pop { 
            animation: bonusPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            will-change: transform, opacity, filter;
        }

        @keyframes snowTwinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8) rotate(0deg) translateZ(0); filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
            50% { opacity: 0.9; transform: scale(1.2) rotate(45deg) translateZ(0); filter: drop-shadow(0 0 20px rgba(255,255,255,1)); }
        }
        .snow-twinkle {
            animation: snowTwinkle var(--duration, 3s) infinite ease-in-out;
            animation-delay: var(--delay, 0s);
            will-change: transform, opacity;
        }

        /* ИСПРАВЛЕНИЕ: Мы убираем -webkit-text-stroke, так как он рисует обводку внутри текста в Chromium,
           что портит шрифты (особенно цифры). Теперь обводка полностью делегирована функции getStroke 
           в JS, которая использует математически точный внешний text-shadow. Классы сохранены для 
           обратной совместимости разметки. */
        .hardware-stroke {
            /* Очищено, теперь используется JS text-shadow */
        }
        .hardware-stroke-thick {
            /* Очищено, теперь используется JS text-shadow */
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { ipcRenderer } = require('electron');

        // Утилиты
        const hexToRgba = (hex, alpha) => {
            hex = hex || '#000000'; hex = hex.replace('#', '');
            let r = parseInt(hex.substring(0, 2), 16) || 0; let g = parseInt(hex.substring(2, 4), 16) || 0; let b = parseInt(hex.substring(4, 6), 16) || 0;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        };

        const getStroke = (isThick, isEnabled, extraShadow = '') => {
            if (isEnabled === false) return extraShadow || 'none';
            
            const color = '#000000';
            let strokeShadow = '';
            
            // Генерируем "честную" внешнюю обводку с помощью множественных теней.
            // Это гарантирует, что обводка не залезет внутрь цифр, как это делал -webkit-text-stroke
            if (isThick) {
                // Плотный круг теней радиусом ~6px для толстой обводки (20 точек для плавности)
                strokeShadow = `
                    0px -6px 0 ${color}, 0px 6px 0 ${color}, -6px 0px 0 ${color}, 6px 0px 0 ${color},
                    -4px -5px 0 ${color}, 4px -5px 0 ${color}, -4px 5px 0 ${color}, 4px 5px 0 ${color},
                    -5px -4px 0 ${color}, 5px -4px 0 ${color}, -5px 4px 0 ${color}, 5px 4px 0 ${color},
                    -2px -6px 0 ${color}, 2px -6px 0 ${color}, -2px 6px 0 ${color}, 2px 6px 0 ${color},
                    -6px -2px 0 ${color}, 6px -2px 0 ${color}, -6px 2px 0 ${color}, 6px 2px 0 ${color}
                `.replace(/\s+/g, ' ').trim();
            } else {
                // Стандартный круг радиусом ~3px (8 точек)
                strokeShadow = `
                    0px -3px 0 ${color}, 0px 3px 0 ${color}, -3px 0px 0 ${color}, 3px 0px 0 ${color},
                    -2px -2px 0 ${color}, 2px -2px 0 ${color}, -2px 2px 0 ${color}, 2px 2px 0 ${color}
                `.replace(/\s+/g, ' ').trim();
            }

            // Добавляем дополнительные тени (свечение) поверх обводки, если они переданы
            return extraShadow ? `${strokeShadow}, ${extraShadow}` : strokeShadow;
        };

        const useWindowScale = (targetWidth, targetHeight) => {
            const [scale, setScale] = useState(1);
            useEffect(() => {
                let frameId;
                const updateScale = () => {
                    const w = window.innerWidth;
                    const h = window.innerHeight;
                    const availableHeight = h - 40; 
                    
                    const scaleX = w / targetWidth;
                    const scaleY = availableHeight / targetHeight;
                    
                    setScale(Math.min(scaleX, scaleY, 1)); 
                };
                
                const handleResize = () => {
                    if (frameId) cancelAnimationFrame(frameId);
                    frameId = requestAnimationFrame(updateScale);
                };

                updateScale();
                window.addEventListener('resize', handleResize);
                return () => {
                    window.removeEventListener('resize', handleResize);
                    if (frameId) cancelAnimationFrame(frameId);
                };
            }, [targetWidth, targetHeight]);
            return scale;
        };

        const formatTime = (totalSeconds) => {
            const h = Math.floor(Math.abs(totalSeconds) / 3600);
            const m = Math.floor((Math.abs(totalSeconds) % 3600) / 60);
            const s = Math.abs(totalSeconds) % 60;
            return `${totalSeconds < 0 ? '-' : ''}${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        };

        const getDynamicColor = (stateObj, configStyles) => {
            const baseColor = configStyles.timerColor || '#ffffff';
            let colorStr = baseColor;
            
            if (stateObj.isFrozen) {
                colorStr = '#38bdf8'; 
            } else if (stateObj.isReversed) {
                colorStr = '#f472b6';
            } else if (stateObj.multiplier?.isActive) {
                colorStr = stateObj.multiplier.type === 'buff' 
                    ? (configStyles.buffColor || '#34d399') 
                    : (configStyles.debuffColor || '#f43f5e');
            } else if (stateObj.timeLeft > 0 && stateObj.timeLeft <= 300) {
                colorStr = '#ef4444'; 
            }
            return colorStr;
        };

        function TimerView() {
            const [state, setState] = useState({ 
                timeLeft: 0, isVictory: false, isBonusPhase: false, isRollingBonus: false, 
                multiplier: { isActive: false }, isFrozen: false, freezeTimeLeft: 0, isReversed: false 
            });
            const [alerts, setAlerts] = useState([]);
            const [config, setConfig] = useState({});
            
            const stateRef = useRef(state);
            const configRef = useRef(config);
            const timeElRef = useRef(null);
            const freezeElRef = useRef(null);
            const multElRef = useRef(null);

            const scale = useWindowScale(1000, 560);

            useEffect(() => {
                stateRef.current = state;
                configRef.current = config;
            }, [state, config]);

            useEffect(() => {
                document.title = "Таймер"; 
                const savedConfig = JSON.parse(localStorage.getItem('marfaleyConfig') || localStorage.getItem('astralConfig') || '{}');
                setConfig(savedConfig);
                configRef.current = savedConfig;
                
                ipcRenderer.on('settings-updated', (e, cfg) => {
                    setConfig(cfg);
                    configRef.current = cfg;
                });
                
                ipcRenderer.on('timer-tick', (e, s) => {
                    // Прямое обновление цифр в DOM
                    if (timeElRef.current && stateRef.current.timeLeft !== s.timeLeft) {
                        timeElRef.current.innerText = formatTime(s.timeLeft);
                        
                        // Прямое обновление цвета
                        const styles = configRef.current.styles || {};
                        const newColor = getDynamicColor(s, styles);
                        if (timeElRef.current.style.color !== newColor) {
                            timeElRef.current.style.color = newColor;
                        }
                        
                        // Всегда обновляем textShadow для таймера на случай, если цвет изменился и нужно обновить свечение
                        const glowIntensity = styles.timerGlow !== undefined ? styles.timerGlow : 0.4;
                        const enableStroke = styles.enableStroke !== false;
                        timeElRef.current.style.textShadow = getStroke(true, enableStroke, `0px 10px 40px ${hexToRgba(newColor, glowIntensity)}, 0px 0px 60px ${hexToRgba(newColor, glowIntensity * 0.75)}`);
                    }
                    
                    if (freezeElRef.current && stateRef.current.freezeTimeLeft !== s.freezeTimeLeft) {
                        freezeElRef.current.innerText = formatTime(s.freezeTimeLeft);
                    }
                    
                    if (multElRef.current && stateRef.current.multiplier?.timeLeft !== s.multiplier?.timeLeft) {
                        multElRef.current.innerText = formatTime(s.multiplier.timeLeft);
                    }

                    const isStructureChanged = 
                        stateRef.current.isVictory !== s.isVictory ||
                        stateRef.current.isFrozen !== s.isFrozen ||
                        stateRef.current.isReversed !== s.isReversed ||
                        stateRef.current.isBonusPhase !== s.isBonusPhase ||
                        stateRef.current.isRollingBonus !== s.isRollingBonus ||
                        stateRef.current.multiplier?.isActive !== s.multiplier?.isActive ||
                        stateRef.current.multiplier?.type !== s.multiplier?.type;

                    if (isStructureChanged) {
                        setState(s);
                    } else {
                        stateRef.current = s; 
                    }
                });
                
                ipcRenderer.on('new-alert', (e, data) => {
                    const id = Date.now() + Math.random();
                    let text = data.isSpecial ? data.giftName : null;
                    if (data.type === 'freeze') text = '❄️ ЗАМОРОЗКА!';
                    else if (data.type === 'unfreeze') text = '🔥 РАЗМОРОЗКА!';
                    else if (data.type === 'reverse_time') text = '🔄 ВРЕМЯ ВСПЯТЬ!';
                    
                    setAlerts(prev => [...prev, { id, amount: data.timeAdded, text: text, type: data.type }]);
                    setTimeout(() => setAlerts(prev => prev.filter(n => n.id !== id)), 2000);
                });

                return () => ipcRenderer.removeAllListeners();
            }, []);

            const styles = config.styles || {};
            const fontFam = styles.fontFamily || 'Inter'; 
            const enableStroke = styles.enableStroke !== false;
            const timerSize = 14; 
            
            const colorStr = getDynamicColor(state, styles);
            const glowIntensity = styles.timerGlow !== undefined ? styles.timerGlow : 0.4;
            const glowStr = getStroke(true, enableStroke, `0px 10px 40px ${hexToRgba(colorStr, glowIntensity)}, 0px 0px 60px ${hexToRgba(colorStr, glowIntensity * 0.75)}`);

            const buffCardBg = styles.buffCardBg || '#10b981'; 
            const debuffCardBg = styles.debuffCardBg || '#e11d48';
            const floatPlusColor = styles.floatPlusColor || '#34d399'; 
            const floatMinusColor = styles.floatMinusColor || '#f87171';

            return (
                <div className="group h-screen w-screen flex flex-col relative overflow-hidden bg-transparent border-2 border-transparent hover:border-white/50 transition-colors duration-300" style={{ fontFamily: fontFam }}>
                    <div className="absolute top-0 left-0 w-full h-10 bg-white flex justify-between items-center px-4 z-50 border-b border-white drag-region shadow-md opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        <div className="flex items-center gap-2"><i className="fa-solid fa-clock text-indigo-600"></i><span className="text-slate-800 text-xs font-bold tracking-widest uppercase">Окно: Таймер</span></div>
                        <button onClick={() => ipcRenderer.send('close-timer-window')} className="no-drag w-7 h-7 flex items-center justify-center rounded-md bg-rose-500 text-white shadow-[0_0_10px_rgba(244,63,94,0.6)] hover:bg-rose-600 hover:shadow-[0_0_15px_rgba(244,63,94,0.9)] transition"><i className="fa-solid fa-xmark"></i></button>
                    </div>

                    <div className="flex-1 w-full relative mt-10 overflow-hidden z-10 pointer-events-none">
                        <div className="absolute top-1/2 left-1/2 pointer-events-auto flex flex-col items-center justify-center no-drag" style={{ width: '1000px', height: '560px', transform: `translate(-50%, -50%) scale(${scale})` }}>
                            
                            <div className="absolute inset-0 pointer-events-none flex items-center justify-center z-30">
                                {alerts.map(num => {
                                    let textColor = num.amount > 0 ? floatPlusColor : num.amount < 0 ? floatMinusColor : '#fbbf24';
                                    if (num.type === 'freeze') textColor = '#38bdf8';
                                    if (num.type === 'unfreeze') textColor = '#fb923c';
                                    if (num.type === 'reverse_time') textColor = '#f472b6';
                                    return (
                                        <div key={num.id} className={`float-up-anim font-black text-shadow-float whitespace-nowrap ${enableStroke ? 'hardware-stroke' : ''}`} style={{ fontSize: `${timerSize * 0.55}rem`, color: textColor, textShadow: getStroke(false, enableStroke, '0px 5px 20px rgba(0,0,0,0.9)') }}>
                                            {num.text ? num.text : `${num.amount > 0 ? '+' : ''}${num.amount} сек`}
                                        </div>
                                    );
                                })}
                            </div>

                            {state.isVictory ? (
                                <h1 className={`font-black text-green-400 text-shadow-victory leading-none no-drag drop-shadow-2xl bonus-pop ${enableStroke ? 'hardware-stroke-thick' : ''}`} style={{ fontSize: `${timerSize * 0.85}rem`, textShadow: getStroke(true, enableStroke, '0 10px 40px rgba(34,197,94,0.6)') }}>ПОБЕДА</h1>
                            ) : (
                                <div className="relative flex flex-col items-center justify-center no-drag w-full">
                                    
                                    {state.isFrozen && (
                                        <div className="absolute inset-0 pointer-events-none z-20">
                                            <div className="absolute top-1/2 left-1/2" style={{ transform: 'translate(-250px, -100px)' }}>
                                                <i className="fa-solid fa-snowflake snow-twinkle text-cyan-200" style={{ '--duration': '2s', '--delay': '0s', fontSize: '4rem' }}></i>
                                            </div>
                                            <div className="absolute top-1/2 left-1/2" style={{ transform: 'translate(200px, 120px)' }}>
                                                <i className="fa-regular fa-snowflake snow-twinkle text-white" style={{ '--duration': '3.5s', '--delay': '0.5s', fontSize: '2.5rem' }}></i>
                                            </div>
                                            <div className="absolute top-1/2 left-1/2" style={{ transform: 'translate(280px, -60px)' }}>
                                                <i className="fa-solid fa-snowflake snow-twinkle text-blue-200" style={{ '--duration': '2.5s', '--delay': '1s', fontSize: '3rem' }}></i>
                                            </div>
                                            <div className="absolute top-1/2 left-1/2" style={{ transform: 'translate(-200px, 150px)' }}>
                                                <i className="fa-regular fa-snowflake snow-twinkle text-cyan-100" style={{ '--duration': '4s', '--delay': '1.5s', fontSize: '5rem' }}></i>
                                            </div>
                                            <div className="absolute top-1/2 left-1/2" style={{ transform: 'translate(0px, -150px)' }}>
                                                <i className="fa-solid fa-snowflake snow-twinkle text-sky-200" style={{ '--duration': '3s', '--delay': '0.8s', fontSize: '2rem' }}></i>
                                            </div>
                                        </div>
                                    )}

                                    <div className="absolute bottom-full mb-4 w-full flex justify-center pointer-events-none">
                                        {state.isBonusPhase && (<div className={`text-indigo-400 font-black uppercase tracking-widest text-3xl animate-pulse ${enableStroke ? 'hardware-stroke' : ''}`} style={{ textShadow: getStroke(false, enableStroke, '0 2px 5px rgba(0,0,0,0.5)') }}>{state.isRollingBonus ? "Определяем доп. время..." : "Доп. время"}</div>)}
                                        {state.isReversed && !state.isBonusPhase && (<div className={`text-pink-400 font-black uppercase tracking-widest text-6xl ${enableStroke ? 'hardware-stroke' : ''}`} style={{ textShadow: getStroke(false, enableStroke, '0 4px 15px rgba(219,39,119,0.6)') }}>🔄 ВРЕМЯ ИДЕТ ВПЕРЕД</div>)}
                                    </div>
                                    
                                    <h1 ref={timeElRef} className={`font-black tabular-nums leading-none transition-all duration-300 relative z-10 ${enableStroke ? 'hardware-stroke-thick' : ''}`} style={{ color: colorStr, textShadow: glowStr, fontSize: `${timerSize}rem` }}>{formatTime(state.timeLeft)}</h1>
                                    
                                    <div className="absolute top-full mt-4 w-full flex flex-row flex-wrap justify-center items-stretch gap-6 pointer-events-none z-30 px-4">
                                        {state.isFrozen && (
                                            <div className={`px-6 py-3 rounded-[2rem] border-4 shadow-2xl flex flex-row items-center justify-center gap-4 ${!state.multiplier?.isActive ? 'animate-pulse' : ''}`} style={{ background: `linear-gradient(135deg, #0284c7 0%, rgba(0,0,0,0.5) 100%)`, borderColor: '#38bdf8' }}>
                                                <span className={`text-4xl md:text-5xl font-black text-white uppercase tracking-wider text-center leading-none ${enableStroke ? 'hardware-stroke' : ''}`} style={{ textShadow: getStroke(false, enableStroke, '0 5px 15px rgba(0,0,0,0.5)') }}>❄️ ЗАМОРОЗКА</span>
                                                <span ref={freezeElRef} className={`text-5xl md:text-6xl font-black text-white tabular-nums bg-black/40 px-6 py-2 rounded-full shadow-inner border border-white/20 leading-none ${enableStroke ? 'hardware-stroke' : ''}`} style={{ textShadow: getStroke(false, enableStroke) }}>{formatTime(state.freezeTimeLeft)}</span>
                                            </div>
                                        )}

                                        {state.multiplier?.isActive && (
                                            <div className={`px-6 py-3 rounded-[2rem] border-4 shadow-2xl flex flex-row items-center justify-center gap-4 ${!state.isFrozen ? 'animate-bounce' : ''}`} style={{ background: state.multiplier.type === 'buff' ? `linear-gradient(135deg, ${buffCardBg} 0%, rgba(0,0,0,0.5) 100%)` : `linear-gradient(135deg, ${debuffCardBg} 0%, rgba(0,0,0,0.5) 100%)`, borderColor: state.multiplier.type === 'buff' ? buffCardBg : debuffCardBg }}>
                                                <span className={`text-4xl md:text-5xl font-black text-white uppercase tracking-wider text-center leading-none ${enableStroke ? 'hardware-stroke' : ''}`} style={{ textShadow: getStroke(false, enableStroke, '0 5px 15px rgba(0,0,0,0.5)') }}>{state.multiplier.type === 'buff' ? `⚡ ПРИБАВЛЯЕТ (x${state.multiplier.value})` : `☠️ УБАВЛЯЕТ (x${state.multiplier.value})`}</span>
                                                <span ref={multElRef} className={`text-5xl md:text-6xl font-black text-white tabular-nums bg-black/40 px-6 py-2 rounded-full shadow-inner border border-white/20 leading-none ${enableStroke ? 'hardware-stroke' : ''}`} style={{ textShadow: getStroke(false, enableStroke) }}>{formatTime(state.multiplier.timeLeft)}</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TimerView />);
    </script>
</body>
</html>
