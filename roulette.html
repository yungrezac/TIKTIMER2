<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRAL GAME - Рулетка</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Bebas+Neue&family=Montserrat:wght@400;800&family=Comic+Neue:wght@700&family=Roboto:wght@700;900&family=Open+Sans:wght@700;800&family=Oswald:wght@700&family=Raleway:wght@800;900&family=Nunito:wght@800;900&family=Playfair+Display:wght@700;900&family=Caveat:wght@700&family=Rubik:wght@700;900&family=Pacifico&family=Yanone+Kaffeesatz:wght@700&family=Comfortaa:wght@700&family=Ruslan+Display&family=Kelly+Slab&family=Roboto+Slab:wght@700;900&family=Lobster&family=Alice&family=PT+Sans:wght@700&display=swap');
        
        body { 
            background-color: transparent; 
            color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            margin: 0;
            padding: 0;
        }

        .drag-region { -webkit-app-region: drag; user-select: none; }
        .no-drag { -webkit-app-region: no-drag; }

        @keyframes floatUpFade { 
            0% { transform: translate(-50%, 50px) scale(0.5); opacity: 0; } 
            15% { transform: translate(-50%, -10px) scale(1.2); opacity: 1; } 
            80% { transform: translate(-50%, -60px) scale(1); opacity: 1; } 
            100% { transform: translate(-50%, -100px) scale(0.8); opacity: 0; } 
        }
        .float-up-anim { animation: floatUpFade 2s ease-out forwards; position: absolute; left: 50%; }

        @keyframes bonusPop { 
            0% { transform: translateZ(0) scale(0.5); opacity: 0; filter: blur(4px); } 
            60% { transform: translateZ(0) scale(1.1); opacity: 1; filter: blur(0px); } 
            100% { transform: translateZ(0) scale(1); opacity: 1; filter: blur(0px); } 
        }
        /* Оптимизировано: добавлен translateZ для GPU и уменьшен радиус блюра */
        .bonus-pop { 
            animation: bonusPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            will-change: transform, opacity;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translate3d(0, 30px, 0); }
            to { opacity: 1; transform: translate3d(0, 0, 0); }
        }
        .animate-fade-in-up { 
            animation: fadeInUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; 
            will-change: transform, opacity;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1) translateZ(0); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.02) translateZ(0); }
        }
        .target-glow { 
            animation: pulseGlow 1.5s infinite ease-in-out; 
            box-shadow: 0 0 40px rgba(255,255,255,0.8), inset 0 0 30px rgba(255,255,255,0.5);
            will-change: transform, opacity;
        }

        @keyframes idleEventPop {
            0% { opacity: 0; transform: translate3d(0, 50px, 0) scale(0.8); }
            10% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
            90% { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
            100% { opacity: 0; transform: translate3d(0, 20px, 0) scale(0.9); }
        }
        .idle-event-overlay {
            animation: idleEventPop 4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            will-change: transform, opacity;
        }

        .roulette-track-bg {
            background: linear-gradient(90deg, transparent 0%, rgba(15,23,42,0.6) 20%, rgba(0,0,0,0.85) 50%, rgba(15,23,42,0.6) 80%, transparent 100%);
            /* Уменьшена сложность теней для производительности */
            box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
            /* Принудительный рендеринг на GPU */
            transform: translateZ(0); 
            backface-visibility: hidden;
        }

        .track-mask {
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
            /* Важно для производительности масок */
            will-change: mask-image;
            transform: translateZ(0);
        }

        /* Возвращаем красивую внешнюю обводку через тени. Благодаря фиксу React рендеринга, это больше не грузит CPU */
        .hardware-stroke {
            text-shadow: 
                -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, 
                -1.5px  1.5px 0 #000, 1.5px  1.5px 0 #000,
                 0px  1.5px 0 #000, 1.5px  0px 0 #000,
                 0px -1.5px 0 #000,-1.5px  0px 0 #000;
        }
        .hardware-stroke-thick {
            text-shadow: 
                -3px -3px 0 #000, 3px -3px 0 #000, 
                -3px  3px 0 #000, 3px  3px 0 #000,
                 0px  3px 0 #000, 3px  0px 0 #000,
                 0px -3px 0 #000,-3px  0px 0 #000;
        }
        
        /* Фикс для плавности анимации трека */
        .gpu-accelerated {
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            perspective: 1000px;
            will-change: transform;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const ipcRenderer = window.require ? window.require('electron').ipcRenderer : { 
            on: () => {}, send: () => {}, removeListener: () => {}, removeAllListeners: () => {}
        };

        // ОПТИМИЗАЦИЯ: Отказываемся от тяжелых text-shadow в пользу -webkit-text-stroke (через CSS классы)
        // Функция теперь возвращает только экстра-тени (например, свечение), а черную обводку берет на себя GPU
        const getShadowOnly = (isEnabled, extraShadow = '') => {
            if (isEnabled === false) return extraShadow;
            return extraShadow ? extraShadow : 'none';
        };

        const getStrokeClass = (isThick, isEnabled) => {
            if (isEnabled === false) return '';
            return isThick ? 'hardware-stroke-thick' : 'hardware-stroke';
        };

        const useWindowScale = (targetWidth, targetHeight) => {
            const [scale, setScale] = useState(1);
            useEffect(() => {
                let timeoutId = null;
                const updateScale = () => {
                    const w = window.innerWidth;
                    const h = window.innerHeight;
                    const availableHeight = h - 40; 
                    const scaleX = w / targetWidth;
                    const scaleY = availableHeight / targetHeight;
                    setScale(Math.min(scaleX, scaleY, 1)); 
                };
                
                // Дебаунс ресайза, чтобы не грузить процессор
                const handleResize = () => {
                    clearTimeout(timeoutId);
                    timeoutId = setTimeout(updateScale, 100);
                };
                
                updateScale();
                window.addEventListener('resize', handleResize);
                return () => {
                    window.removeEventListener('resize', handleResize);
                    clearTimeout(timeoutId);
                };
            }, [targetWidth, targetHeight]);
            return scale;
        };

        const AutoScaleText = ({ text, defaultSize, minSize, maxChars, className, style, shadow, strokeClass = '', wrap }) => {
            if (!text) return null;
            const threshold = wrap ? maxChars * 1.2 : maxChars;
            const size = text.length > threshold ? Math.max(minSize, defaultSize * (threshold / text.length)) : defaultSize;
            return (
                <span 
                    className={`${className} ${strokeClass}`} 
                    style={{ 
                        ...style, 
                        fontSize: `${size}rem`, 
                        textShadow: shadow !== 'none' ? shadow : undefined, 
                        whiteSpace: wrap ? 'normal' : 'word-break', 
                        lineHeight: wrap ? '1.1' : 'inherit' 
                    }}
                >
                    {text}
                </span>
            );
        }

        const getGlobalVolume = () => { try { const vol = localStorage.getItem('marfaleyVolume') || localStorage.getItem('astralVolume'); return vol !== null ? parseFloat(vol) : 0.5; } catch(e) { return 0.5; } };

        let sharedAudioCtx = null;
        const getAudioCtx = () => { 
            if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); 
            if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume(); 
            return sharedAudioCtx; 
        };
        
        let tickBuffer = null;
        const getTickBuffer = () => {
            const ctx = getAudioCtx();
            if (tickBuffer) return tickBuffer;
            const sampleRate = ctx.sampleRate;
            const tickLen = 0.03;
            const length = Math.ceil(sampleRate * tickLen);
            const buffer = ctx.createBuffer(1, length, sampleRate);
            const data = buffer.getChannelData(0);
            
            let phase = 0;
            for (let i = 0; i < length; i++) {
                const t = i / sampleRate;
                const freq = 600 * Math.pow(50 / 600, t / tickLen); 
                phase += 2 * Math.PI * freq / sampleRate;
                const gain = 0.2 * Math.pow(0.001 / 0.2, t / tickLen); 
                data[i] = Math.sin(phase) * gain;
            }
            tickBuffer = buffer;
            return buffer;
        };

        const playSuccessSound = () => { 
            try { 
                const ctx = getAudioCtx(); 
                const osc = ctx.createOscillator(); 
                const gain = ctx.createGain(); 
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(440, ctx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1); 
                gain.gain.setValueAtTime(0.5 * getGlobalVolume(), ctx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); 
                osc.connect(gain); 
                gain.connect(ctx.destination); 
                osc.start(); 
                osc.stop(ctx.currentTime + 0.5); 
            } catch (e) {} 
        };

        const playRouletteSpinSound = (durationMs) => { 
            try { 
                const ctx = getAudioCtx(); 
                const now = ctx.currentTime;
                const durationSec = durationMs / 1000;
                const vol = getGlobalVolume();
                const buffer = getTickBuffer();
                
                const masterGain = ctx.createGain();
                masterGain.gain.value = vol;
                masterGain.connect(ctx.destination);
                
                let timeOffset = 0;
                // ОПТИМИЗАЦИЯ: Уменьшено количество узлов AudioBufferSourceNode для снижения нагрузки на CPU
                let nodeCount = 0;
                while (timeOffset < durationSec && nodeCount < 100) {
                    const progress = timeOffset / durationSec;
                    const delaySec = (60 + Math.pow(progress, 3) * 800) / 1000;
                    
                    const source = ctx.createBufferSource();
                    source.buffer = buffer;
                    source.connect(masterGain);
                    source.start(now + timeOffset);
                    
                    timeOffset += delaySec;
                    nodeCount++;
                }
            } catch (e) { console.error(e); } 
        };

        function RouletteView() {
            const [state, setState] = useState({ 
                isActive: false, isIntro: false, spinMode: 'normal', items: [], 
                winner: null, isFinished: false, user: null, config: {}, isFrozen: false, freezeTimeLeft: 0, 
                activeRouletteId: null, ruiner: { isActive: false, timeLeft: 0, user: null, totalSavesNeeded: 0 },
                actionData: null 
            });
            const [idleAlert, setIdleAlert] = useState(null);
            
            const stateRef = useRef(state);
            const timeoutsRef = useRef([]); 
            const trackRef = useRef(null); 
            const isSpinningRef = useRef(false);
            
            useEffect(() => { stateRef.current = state; }, [state]);
            const scale = useWindowScale(1200, 720);

            const WIN_IDX = 35;
            const SPIN_DUR = 7500; 
            const RESULT_DUR = 3500; 
            const TOTAL_ITEMS = 50; 

            const clearTimeouts = () => {
                timeoutsRef.current.forEach(clearTimeout);
                timeoutsRef.current = [];
            };
            
            const schedule = (cb, delay) => {
                const id = setTimeout(cb, delay);
                timeoutsRef.current.push(id);
                return id;
            };

            const applySpinAnimation = (offset, duration) => {
                if (trackRef.current) {
                    // Используем translate3d для 100% гарантии обработки на GPU
                    trackRef.current.style.transition = `transform ${duration}ms cubic-bezier(0.1, 0.9, 0.1, 1)`;
                    trackRef.current.style.transform = `translate3d(${offset}px, 0, 0)`;
                }
            };

            const resetSpinAnimation = () => {
                if (trackRef.current) {
                    trackRef.current.style.transition = 'none';
                    trackRef.current.style.transform = `translate3d(0px, 0, 0)`;
                }
            };

            useEffect(() => {
                document.title = "Рулетка"; 
                setState(prev => ({...prev, config: JSON.parse(localStorage.getItem('marfaleyConfig') || localStorage.getItem('astralConfig') || '{}')}));
                
                ipcRenderer.on('settings-updated', (e, newCfg) => setState(prev => ({...prev, config: newCfg})));
                
                const calculateOffset = (targetIndex) => { 
                    const trackWidth = 1200; const itemWidth = 192; const gap = 16; 
                    const totalItemWidth = itemWidth + gap; 
                    return -(targetIndex * totalItemWidth) + (trackWidth / 2) - (itemWidth / 2); 
                };

                // ОПТИМИЗАЦИЯ: Игнорируем тики, если рулетка крутится (предотвращает ре-рендер всего React-дерева)
                ipcRenderer.on('timer-tick', (e, payload) => {
                    if (isSpinningRef.current) return;
                    
                    // Обновляем стейт только если данные реально изменились, чтобы не дергать DOM
                    if (stateRef.current.isFrozen !== payload.isFrozen || 
                        stateRef.current.freezeTimeLeft !== payload.freezeTimeLeft ||
                        stateRef.current.ruiner?.isActive !== payload.ruiner?.isActive ||
                        stateRef.current.ruiner?.timeLeft !== payload.ruiner?.timeLeft) {
                        
                        setState(prev => ({ ...prev, isFrozen: payload.isFrozen, freezeTimeLeft: payload.freezeTimeLeft, ruiner: payload.ruiner }));
                    }
                });

                ipcRenderer.on('new-alert', (e, data) => {
                    if (data.type === 'roulette') return;
                    
                    const isBusy = stateRef.current.isFrozen || stateRef.current.ruiner?.isActive;
                    const allowedDuringBusy = ['ruiner', 'save', 'freeze', 'unfreeze'];
                    
                    if (isBusy && !allowedDuringBusy.includes(data.type)) return; 
                    if (isSpinningRef.current) return;
                    
                    setIdleAlert({...data, renderId: Date.now()});
                    schedule(() => { 
                        setIdleAlert(prev => prev?.renderId === data.renderId ? null : prev); 
                    }, 4000);
                });

                ipcRenderer.on('start-roulette', (e, { winner, slots, user, rouletteId }) => {
                    clearTimeouts();
                    setIdleAlert(null); 
                    resetSpinAnimation(); 
                    
                    const items = []; 
                    for(let i=0; i<TOTAL_ITEMS; i++) { items.push(i === WIN_IDX ? winner : slots[Math.floor(Math.random() * slots.length)]); }
                    
                    setState(prev => ({ ...prev, isActive: true, isIntro: true, spinMode: 'normal', items, winner, isFinished: false, user, activeRouletteId: rouletteId, actionData: null }));
                    playSuccessSound();
                    
                    schedule(() => {
                        setState(prev => ({ ...prev, isIntro: false })); 
                        isSpinningRef.current = true; 
                        
                        schedule(() => {
                            playRouletteSpinSound(SPIN_DUR);
                            const baseOffset = calculateOffset(WIN_IDX); 
                            const jitter = (Math.random() * 140) - 70; 
                            
                            applySpinAnimation(baseOffset + jitter, SPIN_DUR);
                            
                            schedule(() => {
                                isSpinningRef.current = false; 
                                playSuccessSound(); 
                                setState(prev => ({ ...prev, isFinished: true })); 
                                ipcRenderer.send('apply-roulette-result', { winner, user, rouletteId });
                                schedule(() => { 
                                    setState(prev => ({ ...prev, isActive: false })); 
                                    ipcRenderer.send('roulette-animation-finished'); 
                                }, RESULT_DUR); 
                            }, SPIN_DUR);
                        }, 50); 
                    }, 3000);
                });

                ipcRenderer.on('start-user-spin', (e, { users, actionData, originalUser, includeAll }) => {
                    clearTimeouts();
                    setIdleAlert(null);
                    resetSpinAnimation();
                    
                    const slots = [];
                    users.forEach(u => slots.push({ username: u.username, label: u.nickname || u.username, avatar: u.avatar, color: '#9333ea', type: 'user' }));
                    
                    if (users.length > 1 && includeAll) {
                        slots.push({ username: 'all', label: 'ВСЕ СОПЕРНИКИ!', avatar: 'https://cdn-icons-png.flaticon.com/512/681/681443.png', color: '#e11d48', type: 'all' });
                    }
                    
                    const items = [];
                    const winnerTarget = slots[Math.floor(Math.random() * slots.length)];
                    for(let i=0; i<TOTAL_ITEMS; i++) {
                        if (i === WIN_IDX) items.push(winnerTarget);
                        else items.push(slots[Math.floor(Math.random() * slots.length)]);
                    }

                    setState(prev => ({ ...prev, isActive: true, isIntro: false, spinMode: 'users', items, winner: winnerTarget, isFinished: false, user: originalUser, actionData }));
                    playSuccessSound();
                    
                    schedule(() => {
                        isSpinningRef.current = true;
                        playRouletteSpinSound(SPIN_DUR);
                        
                        schedule(() => {
                            const baseOffset = calculateOffset(WIN_IDX); const jitter = (Math.random() * 140) - 70;
                            applySpinAnimation(baseOffset + jitter, SPIN_DUR);
                            
                            schedule(() => {
                                isSpinningRef.current = false;
                                playSuccessSound(); setState(prev => ({ ...prev, isFinished: true })); 
                                ipcRenderer.send('apply-mp-action', { targetUsername: winnerTarget.username, actionData, originalUser });
                                schedule(() => { setState(prev => ({ ...prev, isActive: false })); }, RESULT_DUR);
                            }, SPIN_DUR);
                        }, 50);
                    }, 50); 
                });

                ipcRenderer.on('start-bonus-roll', (e, data) => {
                    clearTimeouts();
                    setIdleAlert(null);
                    resetSpinAnimation();
                    
                    const currentCfg = JSON.parse(localStorage.getItem('marfaleyConfig') || localStorage.getItem('astralConfig') || '{}');
                    const min = currentCfg.bonusMin || 60; const max = currentCfg.bonusMax || 300; const items = [];
                    for(let i=0; i<TOTAL_ITEMS; i++) { 
                        if (i === WIN_IDX) { items.push({ label: `+${data.amount} СЕК`, color: '#f59e0b', type: 'bonus' }); } 
                        else { const randTime = Math.floor(Math.random() * (max - min + 1)) + min; items.push({ label: `+${randTime} СЕК`, color: '#6366f1', type: 'bonus' }); } 
                    }
                    
                    setState(prev => ({ ...prev, isActive: true, isIntro: true, spinMode: 'bonus', items, winner: { label: `+${data.amount} СЕК`, color: '#f59e0b' }, isFinished: false, user: { username: data.nickname || data.username, avatar: data.avatar || 'https://cdn-icons-png.flaticon.com/512/1055/1055823.png' }, actionData: null }));
                    playSuccessSound(); 
                    
                    schedule(() => {
                        setState(prev => ({ ...prev, isIntro: false })); 
                        isSpinningRef.current = true;
                        
                        schedule(() => {
                            playRouletteSpinSound(SPIN_DUR);
                            const baseOffset = calculateOffset(WIN_IDX); const jitter = (Math.random() * 140) - 70;
                            applySpinAnimation(baseOffset + jitter, SPIN_DUR);
                            
                            schedule(() => {
                                isSpinningRef.current = false;
                                playSuccessSound(); setState(prev => ({ ...prev, isFinished: true })); 
                                ipcRenderer.send('bonus-roll-finished', data.amount);
                                schedule(() => { setState(prev => ({ ...prev, isActive: false })); }, RESULT_DUR); 
                            }, SPIN_DUR);
                        }, 50);
                    }, 3000); 
                });

                return () => { clearTimeouts(); ipcRenderer.removeAllListeners(); };
            }, []);

            const themeColor = '#6366f1'; 
            const fontFamily = state.config?.styles?.fontFamily || 'Inter'; 
            const enableStroke = state.config?.styles?.enableStroke !== false;
            
            const getDisplayName = (userObj) => {
                if (!userObj) return 'Аноним';
                return userObj.nickname || userObj.username || 'Аноним';
            };

            return (
                <div className="group h-screen w-screen flex flex-col relative overflow-hidden bg-transparent border border-transparent hover:border-white/50 transition-colors duration-300" style={{ fontFamily }}>
                    
                    <div className="absolute top-0 left-0 w-full h-10 bg-white flex justify-between items-center px-4 z-50 border-b border-white drag-region shadow-md opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                        <div className="flex items-center gap-2"><i className="fa-solid fa-dice text-indigo-600"></i><span className="text-slate-800 text-xs font-bold tracking-widest uppercase">Окно: Рулетка</span></div>
                        <button onClick={() => ipcRenderer.send('close-roulette-window')} className="no-drag w-7 h-7 flex items-center justify-center rounded-md bg-rose-500 text-white shadow-[0_0_10px_rgba(244,63,94,0.6)] hover:bg-rose-600 hover:shadow-[0_0_15px_rgba(244,63,94,0.9)] transition"><i className="fa-solid fa-xmark"></i></button>
                    </div>

                    <div className="flex-1 w-full relative mt-10 overflow-hidden z-10 pointer-events-none">
                        
                        {!state.isActive && state.ruiner?.isActive && (
                            <div className="absolute top-4 left-0 w-full pointer-events-none z-[60] flex flex-col items-center">
                                <span className="text-4xl font-black text-rose-400 uppercase tracking-widest drop-shadow-md" style={{textShadow: getShadowOnly(enableStroke, '0 2px 5px rgba(0,0,0,0.8)')}}>До прокрута:</span>
                                <span className={`text-[8rem] font-black text-white leading-none drop-shadow-2xl tabular-nums animate-pulse mt-[-5px] ${getStrokeClass(true, enableStroke)}`} style={{textShadow: getShadowOnly(enableStroke, '0 5px 20px rgba(244,63,94,0.6)')}}>{state.ruiner.timeLeft}</span>
                                <div className="flex items-center gap-3 bg-slate-900/80 backdrop-blur-sm p-2 pr-6 rounded-full border-2 border-rose-500/80 mt-2 shadow-[0_0_15px_rgba(244,63,94,0.4)]">
                                    <img src={state.ruiner.user?.avatar} className="w-12 h-12 rounded-full border-2 border-rose-500 object-cover bg-slate-800"/>
                                    <div className="flex flex-col justify-center">
                                        <span className="text-rose-400 font-bold text-[10px] uppercase tracking-wider leading-none mb-0.5">Руинер:</span>
                                        <span className={`text-white font-black text-lg leading-tight truncate max-w-[180px] ${getStrokeClass(false, enableStroke)}`}>{getDisplayName(state.ruiner.user)}</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {!state.isActive && (
                            <div className="absolute bottom-12 left-0 w-full flex justify-center items-end gap-16 z-[60] pointer-events-none">
                                {state.ruiner?.isActive && state.config?.giftSave && (
                                    <div className="flex flex-col items-center animate-bounce">
                                        <span className={`text-3xl font-black text-amber-400 uppercase tracking-widest drop-shadow-md mb-3 ${getStrokeClass(true, enableStroke)}`} style={{textShadow: getShadowOnly(enableStroke, '0 5px 20px rgba(0,0,0,0.8)')}}>
                                            ДЛЯ СЕЙВА:
                                        </span>
                                        <div className="flex items-center justify-center gap-4 h-28">
                                            <img src={state.config.giftSave.icon} className="w-28 h-28 drop-shadow-[0_0_25px_rgba(251,191,36,0.8)] object-contain" />
                                            <span className={`text-white font-black text-[5rem] leading-none ${getStrokeClass(true, enableStroke)}`} style={{ textShadow: getShadowOnly(enableStroke, '0 5px 20px rgba(0,0,0,1)') }}>
                                                x {state.ruiner.totalSavesNeeded || 1}
                                            </span>
                                        </div>
                                    </div>
                                )}

                                {state.isFrozen && state.config?.giftUnfreeze && (
                                    <div className="flex flex-col items-center animate-bounce drop-shadow-2xl">
                                        <span className={`text-3xl text-cyan-400 font-black uppercase tracking-widest mb-3 text-center ${getStrokeClass(true, enableStroke)}`} style={{ textShadow: getShadowOnly(enableStroke, '0 5px 15px rgba(0,0,0,0.8)') }}>
                                            ДЛЯ РАЗМОРОЗКИ:
                                        </span>
                                        <div className="flex items-center justify-center gap-4 h-28">
                                            <img src={state.config.giftUnfreeze.icon} className="w-28 h-28 drop-shadow-[0_0_25px_rgba(6,182,212,0.8)] object-contain" />
                                            <span className={`text-white font-black text-[5rem] leading-none ${getStrokeClass(true, enableStroke)}`} style={{ textShadow: getShadowOnly(enableStroke, '0 5px 20px rgba(0,0,0,1)') }}>
                                                x {Math.ceil(state.freezeTimeLeft / (state.config.unfreezeDuration || 60))}
                                            </span>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {!state.isActive && idleAlert && (
                            <div className={`absolute left-0 w-full flex justify-center z-50 pointer-events-none ${(idleAlert.type === 'ruiner' || idleAlert.type === 'save') ? 'top-1/2 -translate-y-1/2' : 'bottom-[10%]'}`}>
                                <div key={idleAlert.renderId} className="flex flex-col items-center justify-center idle-event-overlay gap-2">
                                    {idleAlert.type === 'ruiner' ? (
                                        <div className="flex flex-col items-center">
                                            <span className={`text-rose-500 font-black text-[6rem] uppercase tracking-widest leading-none drop-shadow-[0_10px_40px_rgba(244,63,94,0.8)] ${getStrokeClass(true, enableStroke)}`}>РУИНЕР!</span>
                                            <img src={idleAlert.avatar || 'https://via.placeholder.com/64'} className="w-28 h-28 rounded-full border-[6px] border-rose-500 shadow-[0_0_30px_#fff] object-cover bg-slate-900 mt-4" />
                                            <span className={`text-white font-black text-3xl uppercase tracking-widest mt-4 drop-shadow-[0_5px_10px_rgba(0,0,0,0.8)] ${getStrokeClass(true, enableStroke)}`}>{idleAlert.nickname || idleAlert.username || 'Аноним'}</span>
                                        </div>
                                    ) : idleAlert.type === 'save' ? (
                                        <div className="flex flex-col items-center animate-bounce">
                                            <span className={`text-amber-400 font-black text-[7rem] uppercase tracking-widest leading-none drop-shadow-[0_10px_40px_rgba(251,191,36,0.8)] ${getStrokeClass(true, enableStroke)}`} style={{ textShadow: getShadowOnly(enableStroke, '0 5px 20px rgba(0,0,0,1)') }}>СЕЙВ!</span>
                                            <img src={idleAlert.avatar || 'https://via.placeholder.com/64'} className="w-28 h-28 rounded-full border-[6px] border-amber-400 shadow-[0_0_30px_rgba(251,191,36,1)] object-cover bg-slate-900 mt-4" />
                                            <span className={`text-white font-black text-3xl uppercase tracking-widest mt-4 drop-shadow-[0_5px_10px_rgba(0,0,0,0.8)] ${getStrokeClass(true, enableStroke)}`}>{idleAlert.nickname || idleAlert.username || 'Аноним'}</span>
                                        </div>
                                    ) : (
                                        <React.Fragment>
                                            <span className={`text-white font-black text-4xl uppercase tracking-widest drop-shadow-[0_5px_10px_rgba(0,0,0,0.8)] ${getStrokeClass(false, enableStroke)}`} style={{ textShadow: getShadowOnly(enableStroke, '0 2px 10px rgba(0,0,0,1)') }}>{idleAlert.nickname || idleAlert.username || 'Аноним'}</span>
                                            <div className="flex items-center justify-center gap-4 mt-2 drop-shadow-[0_5px_15px_rgba(0,0,0,0.8)]">
                                                <img src={idleAlert.avatar || 'https://via.placeholder.com/64'} className="w-16 h-16 rounded-full border-[3px] border-white shadow-[0_0_15px_#fff] object-cover bg-slate-900" />
                                                <i className={`fa-solid fa-plus text-white text-3xl opacity-80 ${getStrokeClass(false, enableStroke)}`}></i>
                                                {(() => {
                                                    const alertType = idleAlert.originalType || idleAlert.type;
                                                    if (alertType === 'like') {
                                                        return (
                                                            <div className="relative flex items-center justify-center">
                                                                <i className="fa-solid fa-heart text-5xl text-rose-500 drop-shadow-[0_0_15px_rgba(244,63,94,0.8)] animate-pulse"></i>
                                                                {idleAlert.amount && (
                                                                    <span className="absolute -bottom-1 -right-3 bg-rose-600 text-white font-black text-sm px-2 py-0.5 rounded-full border-2 border-white shadow-[0_2px_5px_rgba(0,0,0,0.8)]">{idleAlert.amount}</span>
                                                                )}
                                                            </div>
                                                        );
                                                    } else if (alertType === 'follow') {
                                                        return <i className="fa-solid fa-user-plus text-5xl text-emerald-400 drop-shadow-[0_0_15px_rgba(52,211,153,0.8)]"></i>;
                                                    } else if (idleAlert.giftIcon) {
                                                        return (
                                                            <div className="relative">
                                                                <img src={idleAlert.giftIcon} className="w-16 h-16 drop-shadow-[0_0_15px_#fff] object-contain" />
                                                                {idleAlert.amount > 1 && (
                                                                    <span className="absolute -bottom-2 -right-4 bg-rose-600 text-white font-black text-base px-2 py-0.5 rounded-full border-2 border-white shadow-[0_5px_10px_rgba(0,0,0,0.8)]">x{idleAlert.amount}</span>
                                                                )}
                                                            </div>
                                                        );
                                                    } else {
                                                        return <i className="fa-solid fa-bolt text-5xl text-indigo-400 drop-shadow-[0_0_15px_rgba(99,102,241,0.8)]"></i>;
                                                    }
                                                })()}
                                            </div>
                                            <div className="mt-2">
                                                {(() => {
                                                    let resultText = '';
                                                    let colorClass = 'text-white';
                                                    
                                                    if (idleAlert.type === 'roulette' || idleAlert.type === 'special' || idleAlert.type === 'swap_time') { 
                                                        if (idleAlert.giftName && idleAlert.giftName.startsWith('ОТ ')) {
                                                            resultText = idleAlert.giftName.split(':')[0]; 
                                                        } else {
                                                            resultText = idleAlert.type === 'roulette' ? 'РУЛЕТКА!' : idleAlert.giftName;
                                                        }
                                                        colorClass = 'text-purple-400'; 
                                                    }
                                                    else if (idleAlert.type === 'freeze') { resultText = '❄ ЗАМОРОЗКА'; colorClass = 'text-cyan-400'; }
                                                    else if (idleAlert.type === 'unfreeze') { resultText = '🔥 РАЗМОРОЗКА'; colorClass = 'text-orange-400'; }
                                                    else if (idleAlert.type === 'reverse_time') { resultText = idleAlert.isSpecial ? idleAlert.giftName : (idleAlert.giftName + ' (РАЗВОРОТ)'); colorClass = 'text-pink-400'; }
                                                    else if (idleAlert.type === 'frozen_gift') { resultText = '❄ ЗАМОРОЖЕН'; colorClass = 'text-cyan-400'; }
                                                    else if (idleAlert.type === 'multiplier') { resultText = '⚡ПРИБАВЛЕНИЕ'; colorClass = 'text-emerald-400'; }
                                                    else if (idleAlert.type === 'debuff') { resultText = '☠ УБАВЛЕНИЕ'; colorClass = 'text-rose-400'; }
                                                    else if (idleAlert.type === 'reset_time' || idleAlert.type === 'reset') { resultText = 'ОБНУЛЕНИЕ!'; colorClass = 'text-rose-600'; }
                                                    else if (idleAlert.type === 'set_time' || idleAlert.type === 'set') { 
                                                        const m = Math.floor(idleAlert.targetTime / 60); const s = idleAlert.targetTime % 60;
                                                        resultText = `ОСТАЛОСЬ ${m}:${s.toString().padStart(2, '0')}`; colorClass = 'text-blue-400';
                                                    }
                                                    else if (idleAlert.type === 'like') { resultText = `${idleAlert.timeAdded > 0 ? '+' : ''}${idleAlert.timeAdded} СЕК`; colorClass = 'text-rose-400'; }
                                                    else if (idleAlert.type === 'follow') { resultText = `${idleAlert.timeAdded > 0 ? '+' : ''}${idleAlert.timeAdded} СЕК`; colorClass = 'text-emerald-400'; }
                                                    else if (idleAlert.timeAdded > 0) { resultText = `+${idleAlert.timeAdded} СЕК`; colorClass = 'text-emerald-400'; }
                                                    else if (idleAlert.timeAdded < 0) { resultText = `${idleAlert.timeAdded} СЕК`; colorClass = 'text-rose-400'; }
                                                    else { resultText = idleAlert.giftName || 'ТРИГГЕР'; }

                                                    return (
                                                        <span className={`font-black text-5xl uppercase tracking-widest ${colorClass} ${getStrokeClass(true, enableStroke)}`} style={{ textShadow: getShadowOnly(enableStroke, `0 5px 15px rgba(0,0,0,0.8), 0 0 30px currentColor`) }}>
                                                            {resultText}
                                                        </span>
                                                    );
                                                })()}
                                            </div>
                                        </React.Fragment>
                                    )}
                                </div>
                            </div>
                        )}

                        {state.isActive && (
                            <div className="absolute top-1/2 left-1/2 pointer-events-auto flex flex-col items-center justify-center no-drag z-50" style={{ width: '1200px', height: '720px', transform: `translate(-50%, -50%) scale(${scale})` }}>
                                {state.isIntro ? (
                                    <div className="w-full flex flex-col items-center justify-center bonus-pop py-6 w-[1200px]">
                                        {state.spinMode === 'bonus' ? (
                                            <div className="flex flex-col items-center justify-center text-center bg-black/50 backdrop-blur-xl rounded-[3rem] border-2 border-amber-500/50 shadow-[0_20px_60px_rgba(245,158,11,0.2)] w-[800px] h-[500px] overflow-hidden p-8">
                                                <i className="fa-solid fa-gift text-amber-400 text-7xl mb-6 animate-bounce drop-shadow-[0_0_30px_rgba(251,191,36,0.8)]"></i>
                                                <h2 className={`text-5xl text-white font-black uppercase tracking-widest ${getStrokeClass(false, enableStroke)}`} style={{ textShadow: getShadowOnly(enableStroke, '0 4px 10px rgba(0,0,0,0.8)') }}>Рулетка времени</h2>
                                            </div>
                                        ) : (
                                            <div className="flex flex-col items-center justify-center text-center bg-black/50 backdrop-blur-xl rounded-[3rem] border-2 border-indigo-500/50 shadow-[0_20px_60px_rgba(99,102,241,0.2)] w-[800px] min-h-[600px] overflow-hidden p-10">
                                                <h2 className={`text-3xl text-indigo-300 font-bold uppercase tracking-widest mb-6 ${getStrokeClass(false, enableStroke)}`}>Вращение запускает</h2>
                                                
                                                {state.user?.isLikesRoulette ? (
                                                    <div className="relative mb-8 shrink-0 flex items-center justify-center w-64 h-64">
                                                        <i className="fa-solid fa-heart text-rose-500 text-[12rem] drop-shadow-[0_0_80px_rgba(244,63,94,0.8)] animate-pulse"></i>
                                                    </div>
                                                ) : (
                                                    <div className="relative mb-8 shrink-0">
                                                        <div className="absolute inset-0 rounded-full animate-ping bg-indigo-500/50"></div>
                                                        <img src={state.user?.avatar} className="relative w-64 h-64 rounded-full border-[6px] shadow-[0_0_80px_rgba(99,102,241,0.8)] object-cover bg-slate-800 z-10" style={{borderColor: themeColor}} />
                                                    </div>
                                                )}
                                                
                                                <AutoScaleText text={getDisplayName(state.user)} defaultSize={5} minSize={2.5} maxChars={12} className="font-black text-white mb-6 text-center tracking-tight" shadow={getShadowOnly(enableStroke, '0 10px 25px rgba(0,0,0,0.8)')} strokeClass={getStrokeClass(true, enableStroke)} />
                                                
                                                {state.user?.triggerGift && (
                                                    <div className="flex items-center gap-4 bg-slate-900/80 px-8 py-4 rounded-2xl border border-white/20 shadow-2xl shrink-0 max-w-[80%] mt-2">
                                                        <span className="text-slate-300 font-bold text-2xl uppercase shrink-0">Триггер:</span>
                                                        <img src={state.user.triggerGift.icon} className="w-14 h-14 drop-shadow-[0_5px_15px_rgba(0,0,0,0.5)] hover:scale-110 transition-transform shrink-0" />
                                                        <AutoScaleText text={state.user.triggerGift.name} defaultSize={2.5} minSize={1.5} maxChars={15} className="text-white font-black" shadow={'none'} strokeClass={getStrokeClass(false, enableStroke)} />
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                ) : !state.isFinished ? (
                                    <div className="w-[1200px] flex flex-col items-center animate-fade-in-up">
                                        <div className="bg-black/50 backdrop-blur-xl rounded-[2rem] px-8 py-4 flex items-center gap-6 mb-10 border border-white/10 shadow-[0_15px_50px_rgba(0,0,0,0.6)] max-w-[800px] overflow-hidden">
                                            {state.spinMode === 'bonus' ? (
                                                <div className="flex items-center gap-4">
                                                    <i className="fa-solid fa-clock text-amber-400 text-4xl drop-shadow-[0_0_15px_rgba(251,191,36,0.5)]"></i>
                                                    <span className={`text-white font-black text-3xl uppercase tracking-widest ${getStrokeClass(false, enableStroke)}`}>Бонусная рулетка</span>
                                                </div>
                                            ) : state.spinMode === 'users' ? (
                                                <div className="flex items-center gap-4">
                                                    <i className="fa-solid fa-users text-rose-400 text-4xl drop-shadow-[0_0_15px_rgba(244,63,94,0.5)]"></i>
                                                    <span className={`text-white font-black text-3xl uppercase tracking-widest ${getStrokeClass(false, enableStroke)}`}>Выбор</span>
                                                </div>
                                            ) : (
                                                <React.Fragment>
                                                    {state.user?.isLikesRoulette ? (
                                                        <div className="flex items-center justify-center w-16 h-16 shrink-0 drop-shadow-[0_0_15px_rgba(244,63,94,0.5)]">
                                                            <i className="fa-solid fa-heart text-rose-500 text-5xl animate-pulse"></i>
                                                        </div>
                                                    ) : (
                                                        <img src={state.user?.avatar} className="w-16 h-16 rounded-full border-2 border-white/30 object-cover shadow-[0_0_20px_rgba(255,255,255,0.2)] shrink-0" />
                                                    )}
                                                    
                                                    <div className="flex flex-col justify-center overflow-hidden min-w-[200px]">
                                                        <AutoScaleText text={getDisplayName(state.user)} defaultSize={1.5} minSize={0.8} maxChars={15} className="text-white font-black leading-none mb-1 text-left" shadow={'none'} strokeClass={getStrokeClass(false, enableStroke)} />
                                                        <span className="text-indigo-300 font-bold text-sm tracking-wider uppercase">Крутит колесо</span>
                                                    </div>
                                                    {state.user?.triggerGift && (
                                                        <div className="flex items-center gap-3 bg-white/10 px-4 py-2 rounded-xl border border-white/10 ml-4 shadow-inner shrink-0 max-w-[250px] overflow-hidden">
                                                            <img src={state.user.triggerGift.icon} className="w-10 h-10 drop-shadow-md shrink-0" />
                                                            <AutoScaleText text={state.user.triggerGift.name} defaultSize={1.1} minSize={0.7} maxChars={15} className="text-white font-bold" shadow="none" />
                                                        </div>
                                                    )}
                                                </React.Fragment>
                                            )}
                                        </div>
                                        
                                        <div className="relative w-full h-[200px] roulette-track-bg rounded-[2rem] overflow-hidden border border-white/10 shadow-2xl pointer-events-none track-mask">
                                            <div className="absolute top-0 left-1/2 -translate-x-1/2 z-30 drop-shadow-[0_5px_15px_rgba(255,255,255,0.8)]">
                                                <svg width="32" height="24" viewBox="0 0 32 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M16 24L0 0H32L16 24Z" fill="#ffffff"/>
                                                </svg>
                                            </div>
                                            <div className="absolute bottom-0 left-1/2 -translate-x-1/2 z-30 drop-shadow-[0_-5px_15px_rgba(255,255,255,0.8)]">
                                                <svg width="32" height="24" viewBox="0 0 32 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                    <path d="M16 0L32 24H0L16 0Z" fill="#ffffff"/>
                                                </svg>
                                            </div>
                                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[216px] h-[160px] border-4 border-white/80 rounded-[1.25rem] z-20 target-glow pointer-events-none"></div>
                                            
                                            {/* ОПТИМИЗАЦИЯ: Добавлен класс gpu-accelerated */}
                                            <div ref={trackRef} className="flex h-full absolute left-0 items-center px-0 gpu-accelerated" style={{ gap: '16px' }}>
                                                {state.items.map((item, i) => (
                                                    <div key={i} className="w-48 h-36 flex-shrink-0 rounded-2xl flex flex-col items-center justify-center border-[3px] border-white/20 relative overflow-hidden px-2" style={{ backgroundColor: item.color || '#3b82f6' }}>
                                                        <div className="absolute inset-0 bg-gradient-to-br from-white/40 via-transparent to-black/40 pointer-events-none"></div>
                                                        {item.avatar && <img src={item.avatar} className="w-12 h-12 rounded-full border-2 border-white/50 mb-1 z-10 object-cover shadow-md shrink-0" />}
                                                        {/* ИСПОЛЬЗУЕМ АППАРАТНУЮ ОБВОДКУ ВМЕСТО ТЕНЕЙ */}
                                                        <AutoScaleText text={item.label} defaultSize={item.avatar ? 1.4 : 2} minSize={0.8} maxChars={8} wrap={true} className="text-white font-black text-center leading-tight uppercase relative z-10" shadow={'0 2px 4px rgba(0,0,0,0.8)'} strokeClass={getStrokeClass(false, enableStroke)} />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="w-[1200px] flex flex-col items-center justify-center bonus-pop drop-shadow-[0_20px_50px_rgba(0,0,0,0.8)]">
                                        {state.spinMode === 'bonus' ? (
                                            <div className="bg-black/60 backdrop-blur-xl rounded-[3rem] border-4 flex flex-col items-center justify-center w-[900px] h-[550px] p-8 overflow-hidden" style={{ borderColor: state.winner.color, boxShadow: `0 0 80px ${state.winner.color}60` }}>
                                                <span className={`text-4xl text-slate-300 font-bold uppercase tracking-widest mb-6 ${getStrokeClass(false, enableStroke)}`}>Бонус:</span>
                                                <div className="w-full flex items-center justify-center">
                                                    <AutoScaleText text={state.winner.label} defaultSize={7} minSize={2.5} maxChars={10} wrap={true} className="leading-[1] font-black text-white text-center uppercase" shadow={getShadowOnly(enableStroke, `0px 10px 40px ${state.winner.color}, 0px 0px 80px ${state.winner.color}`)} strokeClass={getStrokeClass(true, enableStroke)} />
                                                </div>
                                            </div>
                                        ) : state.spinMode === 'users' ? (
                                            <div className="bg-black/60 backdrop-blur-xl rounded-[3rem] border-4 flex flex-col items-center justify-center w-[900px] min-h-[550px] p-8 overflow-hidden" style={{ borderColor: state.winner.color, boxShadow: `0 0 80px ${state.winner.color}60` }}>
                                                <span className={`text-4xl text-rose-300 font-bold uppercase tracking-widest mb-6 ${getStrokeClass(false, enableStroke)}`}>ЦЕЛЬ ВЫБРАНА:</span>
                                                
                                                {state.winner.avatar && (
                                                    <div className="relative mb-6 shrink-0">
                                                        <img src={state.winner.avatar} className="relative w-40 h-40 rounded-full border-[6px] shadow-[0_0_40px_rgba(255,255,255,0.4)] object-cover z-10" style={{borderColor: state.winner.color}} />
                                                    </div>
                                                )}

                                                <div className="w-full flex items-center justify-center flex-col gap-4">
                                                    <AutoScaleText text={state.winner.label} defaultSize={state.winner.avatar ? 5.5 : 7} minSize={2.5} maxChars={15} wrap={true} className="leading-[1] font-black text-white text-center uppercase" shadow={getShadowOnly(enableStroke, `0px 10px 40px ${state.winner.color}, 0px 0px 80px ${state.winner.color}`)} strokeClass={getStrokeClass(true, enableStroke)} />
                                                    <span className={`text-3xl text-slate-300 font-black mt-4 uppercase drop-shadow-md ${getStrokeClass(false, enableStroke)}`}>Получает: {state.actionData?.label}</span>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="bg-black/60 backdrop-blur-xl rounded-[3rem] border-4 flex flex-col items-center justify-center w-[900px] min-h-[700px] p-10 overflow-hidden" style={{ borderColor: state.winner.color || themeColor, boxShadow: `0 0 80px ${(state.winner.color || themeColor)}60` }}>
                                                <div className="flex flex-col items-center gap-4 mb-6 w-full justify-center text-center mt-2">
                                                    {state.user?.isLikesRoulette ? (
                                                        <div className="flex items-center justify-center w-56 h-56 shrink-0 drop-shadow-[0_0_60px_rgba(244,63,94,0.6)]">
                                                            <i className="fa-solid fa-heart text-rose-500 text-[10rem] animate-pulse"></i>
                                                        </div>
                                                    ) : (
                                                        <img src={state.user?.avatar} className="w-56 h-56 rounded-full border-[6px] shadow-[0_0_60px_rgba(255,255,255,0.6)] object-cover bg-slate-800 shrink-0" style={{borderColor: themeColor}} />
                                                    )}
                                                    
                                                    <div className="flex flex-col items-center justify-center w-full mt-4">
                                                        <AutoScaleText text={getDisplayName(state.user)} defaultSize={4.5} minSize={2} maxChars={12} className="font-black text-white leading-none mb-6 text-center" shadow={getShadowOnly(enableStroke, '0 6px 15px rgba(0,0,0,0.6)')} strokeClass={getStrokeClass(true, enableStroke)} />
                                                        <span className={`text-slate-300 font-bold uppercase text-3xl tracking-widest block ${getStrokeClass(false, enableStroke)}`}>Выбивает:</span>
                                                    </div>
                                                </div>
                                                <div className="w-full flex items-center justify-center mt-4">
                                                    <AutoScaleText text={state.winner.label} defaultSize={6.5} minSize={2.5} maxChars={12} wrap={true} className="leading-[1] font-black text-white text-center transform hover:scale-105 transition-transform" shadow={getShadowOnly(enableStroke, `0px 10px 40px ${state.winner.color || '#fff'}, 0px 0px 80px ${state.winner.color || '#fff'}`)} strokeClass={getStrokeClass(true, enableStroke)} />
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RouletteView />);
    </script>
</body>
</html>
