<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ВАЖНО: Этот тег отключает Referer, позволяя загружать аватарки с серверов TikTok без блокировки -->
    <meta name="referrer" content="no-referrer">
    <title>TIKTIMER</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Bebas+Neue&family=Montserrat:wght@400;800&family=Comic+Neue:wght@700&family=Roboto:wght@700;900&family=Open+Sans:wght@700;800&family=Oswald:wght@700&family=Raleway:wght@800;900&family=Nunito:wght@800;900&family=Playfair+Display:wght@700;900&family=Caveat:wght@700&family=Rubik:wght@700;900&family=Pacifico&family=Yanone+Kaffeesatz:wght@700&family=Comfortaa:wght@700&family=Ruslan+Display&family=Kelly+Slab&family=Roboto+Slab:wght@700;900&family=Lobster&family=Alice&family=PT+Sans:wght@700&display=swap');
        
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        
        .drag-region { -webkit-app-region: drag; user-select: none; }
        .no-drag { -webkit-app-region: no-drag; }

        @keyframes shake {
            0%, 100% { transform: translateX(-50%); }
            20% { transform: translateX(calc(-50% - 10px)); }
            40% { transform: translateX(calc(-50% + 10px)); }
            60% { transform: translateX(calc(-50% - 10px)); }
            80% { transform: translateX(calc(-50% + 10px)); }
        }
        .animate-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        @keyframes fadeInDownCentered {
            from { opacity: 0; transform: translate(-50%, -30px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
        .animate-fade-in-down-centered { animation: fadeInDownCentered 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        .tab-active { background: linear-gradient(135deg, rgba(99,102,241,0.2) 0%, rgba(168,85,247,0.2) 100%); border-right: 3px solid #818cf8; color: white; }
        .tab-inactive { color: #94a3b8; }
        .tab-inactive:hover { background: #1e293b; color: white; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { ipcRenderer } = require('electron');

        const ColorPicker = ({ label, value, onChange }) => (
            <div className="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-700">
                <span className="text-xs font-bold text-slate-400 uppercase">{label}</span>
                <input type="color" value={value || '#ffffff'} onChange={onChange} className="w-8 h-8 rounded border-none bg-transparent cursor-pointer" />
            </div>
        );

        const hexToRgba = (hex, alpha) => {
            hex = hex || '#000000'; hex = hex.replace('#', '');
            let r = parseInt(hex.substring(0, 2), 16) || 0; let g = parseInt(hex.substring(2, 4), 16) || 0; let b = parseInt(hex.substring(4, 6), 16) || 0;
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        };

        const getStroke = (isThick, isEnabled, extraShadow = '') => {
            if (isEnabled === false) return extraShadow;
            const stroke = isThick 
                ? '-0.04em -0.04em 0 #000, 0.04em -0.04em 0 #000, -0.04em 0.04em 0 #000, 0.04em 0.04em 0 #000, -0.04em 0 0 #000, 0.04em 0 0 #000, 0 -0.04em 0 #000, 0 0.04em 0 #000' 
                : '-0.025em -0.025em 0 #000, 0.025em -0.025em 0 #000, -0.025em 0.025em 0 #000, 0.025em 0.025em 0 #000';
            return extraShadow ? `${stroke}, ${extraShadow}` : stroke;
        };

        const supabaseUrl = 'https://lqjagftaeejdufwwvjwd.supabase.co';
        const supabaseKey = 'sb_publishable_6-9IBhMX9CMVbIackZAJ9g_UUk5FDqx';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        const knownGiftsCache = new Set();
        ipcRenderer.on('check-and-save-gift', async (e, gift) => {
            if (!gift || !gift.gift_id || knownGiftsCache.has(gift.gift_id)) return;
            try {
                const { error } = await supabase.from('gift_library').upsert([{ gift_id: gift.gift_id, name: gift.name, icon: gift.icon, cost: gift.cost }], { onConflict: 'gift_id' });
                if (!error) { knownGiftsCache.add(gift.gift_id); window.dispatchEvent(new CustomEvent('new-gift-saved', { detail: gift })); }
            } catch (err) { }
        });

        const getGlobalVolume = () => { try { const vol = localStorage.getItem('marfaleyVolume') || localStorage.getItem('astralVolume'); return vol !== null ? parseFloat(vol) : 0.5; } catch(e) { return 0.5; } };

        let sharedAudioCtx = null;
        const getAudioCtx = () => { if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (sharedAudioCtx.state === 'suspended') sharedAudioCtx.resume(); return sharedAudioCtx; };
        
        const playSuccessSound = () => { 
            try { const ctx = getAudioCtx(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.type = 'sine'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.1); 
                gain.gain.setValueAtTime(0.5 * getGlobalVolume(), ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5); 
                osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.5); 
            } catch (e) {} 
        };

        const playErrorSound = () => { 
            try { const ctx = getAudioCtx(); const osc = ctx.createOscillator(); const gain = ctx.createGain(); 
                osc.type = 'square'; osc.frequency.setValueAtTime(150, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2); 
                gain.gain.setValueAtTime(0.5 * getGlobalVolume(), ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4); 
                osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.4); 
            } catch (e) {} 
        };

        ipcRenderer.on('play-success-sound', playSuccessSound);
        ipcRenderer.on('play-error-sound', playErrorSound);

        function GiftModal({ isOpen, onClose, onSelect }) {
            const [gifts, setGifts] = useState([]);
            const [search, setSearch] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            
            useEffect(() => {
                if (!isOpen) return;
                setIsLoading(true);
                supabase.from('gift_library').select('*').then(({ data, error }) => { 
                    setIsLoading(false);
                    if (data && data.length > 0) {
                        const grouped = data.reduce((acc, curr) => {
                            const giftName = curr.name || 'Без названия';
                            if (!acc[giftName]) { acc[giftName] = { ...curr, name: giftName, ids: [curr.gift_id] }; } 
                            else if (!acc[giftName].ids.includes(curr.gift_id)) { acc[giftName].ids.push(curr.gift_id); }
                            return acc;
                        }, {});
                        setGifts(Object.values(grouped).sort((a, b) => (a.cost || 0) - (b.cost || 0)));
                    }
                }).catch(() => setIsLoading(false));
            }, [isOpen]);
            
            if (!isOpen) return null;
            const filteredGifts = gifts.filter(g => (g.name || '').toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="fixed inset-0 bg-slate-950/90 flex items-center justify-center p-6 z-[9999] backdrop-blur-sm no-drag">
                    <div className="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-4xl h-[85vh] flex flex-col shadow-2xl">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold text-white">Библиотека подарков</h2>
                            <button onClick={onClose} className="text-slate-400 hover:text-white transition text-xl"><i className="fa-solid fa-xmark"></i></button>
                        </div>
                        <input type="text" placeholder="Поиск подарка..." value={search} onChange={e => setSearch(e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 mb-4 focus:border-indigo-500 text-white outline-none transition" />
                        
                        <div className="flex-1 overflow-y-auto grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-4 pr-2 custom-scrollbar">
                            {isLoading ? (
                                <div className="col-span-full text-center text-indigo-400 mt-10 animate-pulse">Загрузка...</div> 
                            ) : (
                                filteredGifts.map((g, idx) => (
                                    <div key={`${g.name}-${idx}`} onClick={() => { onSelect(g); onClose(); setSearch(''); }} className="cursor-pointer bg-slate-800/50 p-4 rounded-xl hover:bg-slate-700 transition flex flex-col items-center group border border-transparent hover:border-indigo-500">
                                        <img src={g.icon} alt={g.name} className="w-16 h-16 object-contain mb-3 group-hover:scale-110 transition drop-shadow-lg" />
                                        <span className="text-sm text-center font-bold leading-tight text-slate-200">{g.name}</span>
                                        <span className="text-xs text-indigo-400 mt-1 font-semibold">{g.cost || 0} монет</span>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function MainView() {
            const [activeTab, setActiveTab] = useState('connect');
            const [status, setStatus] = useState({ tt: { text: 'Ожидание', isActive: false, avatar: null, nickname: null }, da: 'Ожидание', dp: 'Ожидание', dx: 'Ожидание' });
            const [isRunning, setIsRunning] = useState(false);
            const [modal, setModal] = useState({ isOpen: false, key: null });
            const [expandedRoulette, setExpandedRoulette] = useState(null);
            
            const [mpState, setMpState] = useState({ isConnected: false, roomId: null, users: [], error: null });
            const [mpRoomInput, setMpRoomInput] = useState('');

            const [uptimeStartTime, setUptimeStartTime] = useState(() => {
                const now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                return now.toISOString().slice(0, 16);
            });
            const [uptimeRouletteId, setUptimeRouletteId] = useState('');

            const defConfig = {
                username: '', daClientId: '', dpApiKey: '', dxToken: '', 
                initialTime: 60, bonusEnabled: true, bonusMin: 60, bonusMax: 300,
                isFreezeEnabled: false, giftFreeze: null, freezeDuration: 60, freezeDonationAmount: '',
                giftUnfreeze: null, unfreezeDuration: 60, unfreezeDonationAmount: '',
                isReverseEnabled: false, giftReverse: null, reverseDonationAmount: '',
                isRuinerEnabled: false, giftRuiner: null, ruinerDonationAmount: '', ruinerDuration: 60, ruinerMinTime: 60, ruinerMaxTime: 300,
                giftSave: null, saveDonationAmount: '',
                isPenaltyEnabled: true, penalties: [],
                isSetTimeEnabled: true, giftSetTime: null, setTimeValue: 300, setTimeDonationAmount: '',
                isResetEnabled: true, giftReset: null, resetDonationAmount: '',
                isMultiplierGiftEnabled: true, multiplierValue: 2, multiplierDuration: 60, giftMultiplier: null, multiplierDonationAmount: '',
                isDebuffGiftEnabled: false, debuffValue: 2, debuffDuration: 60, giftDebuff: null, debuffDonationAmount: '',
                likesEnabled: true, likeThreshold: 100, likeTime: 10, 
                subsEnabled: true, subTime: 180, customGifts: [],
                roulettes: [
                    { id: 'default-1', name: 'Стандартная рулетка', triggerType: 'both', triggerGifts: [], donationAmount: '', likesThreshold: 100000, addsCost: false, isMain: true, slots: [] }
                ],
                styles: { 
                    fontFamily: 'Inter, sans-serif', timerColor: '#ffffff', timerGlow: 0.4, enableStroke: true,
                    buffColor: '#34d399', debuffColor: '#f43f5e', floatPlusColor: '#34d399', floatMinusColor: '#f87171',
                    buffCardBg: '#10b981', debuffCardBg: '#e11d48'
                }
            };
            
            const [volume, setVolume] = useState(getGlobalVolume());

            const [savedConfig, setSavedConfig] = useState(() => {
                const saved = localStorage.getItem('marfaleyConfig') || localStorage.getItem('astralConfig'); 
                let parsed = saved ? JSON.parse(saved) : {};
                
                if (!parsed.roulettes && (parsed.rouletteSlots || parsed.giftRoulette || parsed.likesRouletteEnabled)) {
                    parsed.roulettes = [{
                        id: 'default-1',
                        name: 'Стандартная рулетка',
                        triggerType: parsed.likesRouletteEnabled ? (parsed.giftRoulette ? 'both' : 'like') : 'gift',
                        triggerGifts: parsed.giftRoulette ? [parsed.giftRoulette] : [],
                        donationAmount: parsed.rouletteDonationAmount || '',
                        likesThreshold: parsed.likesRouletteThreshold || 100000,
                        addsCost: parsed.rouletteGiftAddsCost || false,
                        isMain: true,
                        slots: parsed.rouletteSlots || []
                    }];
                }

                if (!parsed.penalties && parsed.isPenaltyEnabled !== undefined) {
                    parsed.penalties = [{
                        id: 'default-penalty',
                        gift: parsed.giftPenalty || null,
                        donationAmount: parsed.penaltyDonationAmount || '',
                        penaltyAmount: parsed.penaltyAmount || 600,
                        penaltyThreshold: parsed.penaltyThreshold || 300,
                        isEnabled: true
                    }];
                }
                
                if (parsed.roulettes && parsed.roulettes.length > 0) {
                    const hasMain = parsed.roulettes.some(r => r.isMain);
                    if (!hasMain) parsed.roulettes[0].isMain = true;
                }
                
                return { ...defConfig, ...parsed, styles: { ...defConfig.styles, ...(parsed.styles || {}) } };
            });

            const [config, setConfig] = useState(savedConfig);
            const hasChanges = JSON.stringify(savedConfig) !== JSON.stringify(config);

            const formatPayload = (data) => ({
                ...data,
                giftSetTimeIds: data.giftSetTime?.ids || [],
                giftResetIds: data.giftReset?.ids || [], 
                giftMultiplierIds: data.giftMultiplier?.ids || [], giftDebuffIds: data.giftDebuff?.ids || [],
                giftFreezeIds: data.giftFreeze?.ids || [], giftUnfreezeIds: data.giftUnfreeze?.ids || [],
                giftReverseIds: data.giftReverse?.ids || [],
                giftRuinerIds: data.giftRuiner?.ids || [], giftSaveIds: data.giftSave?.ids || [],
                penalties: (data.penalties || []).map(p => ({
                    ids: p.gift?.ids || [],
                    donationAmount: p.donationAmount,
                    penaltyAmount: p.penaltyAmount,
                    penaltyThreshold: p.penaltyThreshold,
                    isEnabled: p.isEnabled
                })),
                customTriggers: data.customGifts.filter(cg => cg.gift || cg.donationAmount).map(cg => ({ 
                    ids: cg.gift?.ids || [], 
                    donationAmount: cg.donationAmount,
                    type: cg.type, 
                    value: cg.value, 
                    isEnabled: cg.isEnabled 
                })),
                roulettes: (data.roulettes || []).map(r => ({
                    ...r,
                    triggerGiftIds: (r.triggerGifts || []).flatMap(g => g.ids || [])
                }))
            });

            useEffect(() => { ipcRenderer.send('update-settings', formatPayload(config)); }, [config]);

            useEffect(() => {
                ipcRenderer.send('get-initial-status');
                const handleTtStatus = (e, data) => setStatus(p => ({...p, tt: data})); 
                const handleDaStatus = (e, t) => setStatus(p => ({...p, da: t}));
                const handleDpStatus = (e, t) => setStatus(p => ({...p, dp: t})); const handleDxStatus = (e, t) => setStatus(p => ({...p, dx: t}));
                
                // ОПТИМИЗАЦИЯ: Предотвращаем лишние ререндеры если статус не изменился
                const handleTimerTick = (e, s) => {
                    setIsRunning(prev => prev !== s.isRunning ? s.isRunning : prev);
                };
                
                const handleMpStatus = (e, data) => setMpState(data);

                ipcRenderer.on('tiktok-status', handleTtStatus); ipcRenderer.on('da-status', handleDaStatus);
                ipcRenderer.on('dp-status', handleDpStatus); ipcRenderer.on('dx-status', handleDxStatus);
                ipcRenderer.on('timer-tick', handleTimerTick);
                ipcRenderer.on('mp-status', handleMpStatus);

                return () => {
                    ipcRenderer.removeListener('tiktok-status', handleTtStatus); ipcRenderer.removeListener('da-status', handleDaStatus);
                    ipcRenderer.removeListener('dp-status', handleDpStatus); ipcRenderer.removeListener('dx-status', handleDxStatus);
                    ipcRenderer.removeListener('timer-tick', handleTimerTick);
                    ipcRenderer.removeListener('mp-status', handleMpStatus);
                };
            }, [activeTab]);

            const triggerShake = () => { const bar = document.getElementById('save-bar'); if(bar) { bar.classList.remove('animate-shake'); void bar.offsetWidth; bar.classList.add('animate-shake'); } };
            const handleTabClick = (id) => { if (hasChanges) { triggerShake(); return; } setActiveTab(id); };
            const handleSave = () => { setSavedConfig(config); localStorage.setItem('marfaleyConfig', JSON.stringify(config)); ipcRenderer.send('update-settings', formatPayload(config)); };
            const handleCancel = () => { setConfig(savedConfig); };

            const updateRoulette = (rId, field, value) => {
                setConfig(prev => ({ ...prev, roulettes: prev.roulettes.map(r => r.id === rId ? { ...r, [field]: value } : r) }));
            };

            const renderTrigger = (gift, modalKey, amountKey, colorHover, textClass = "text-slate-400", placeholderText = "Донат") => (
                <div className="flex flex-col xl:flex-row xl:items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-700 gap-3 mb-2">
                    <div className="flex items-center gap-3 overflow-hidden">
                        {gift ? <div className="flex items-center gap-2 overflow-hidden"><img src={gift.icon} className="w-6 h-6 shrink-0 object-contain"/> <span className="font-bold text-xs text-slate-200 truncate max-w-[150px]">{gift.name}</span></div> : <span className="text-slate-500 text-xs truncate">Подарок не выбран</span>}
                        <button onClick={() => setModal({ isOpen: true, key: modalKey })} className="bg-slate-800 hover:bg-slate-700 text-[10px] font-bold px-2 py-1 rounded transition text-white shrink-0 shadow-md">Выбрать</button>
                    </div>
                    <div className={`flex items-center gap-2 shrink-0 bg-slate-900 px-2 py-1.5 rounded-lg border border-slate-800 transition-colors ${colorHover}`}>
                        <span className={`text-[10px] font-bold uppercase ${textClass}`}><i className="fa-solid fa-ruble-sign mr-1"></i>{placeholderText}:</span>
                        <input type="number" value={config[amountKey] || ''} onChange={e => setConfig({...config, [amountKey]: e.target.value === '' ? '' : Number(e.target.value)})} className="w-16 bg-transparent text-xs text-white font-bold outline-none text-right" placeholder="0" title="Точная сумма в рублях" />
                    </div>
                </div>
            );

            const TabBtn = ({ id, icon, text }) => (
                <button onClick={() => handleTabClick(id)} className={`w-full flex items-center gap-3 px-6 py-4 font-semibold transition ${activeTab === id ? 'tab-active' : 'tab-inactive'}`}><i className={icon + " w-5 text-center text-lg"}></i> {text}</button>
            );

            const fontOptions = [
                { label: 'Inter (Современный)', value: 'Inter, sans-serif' }, { label: 'Bebas Neue (Компактный)', value: '"Bebas Neue", sans-serif' },
                { label: 'Montserrat (Жирный)', value: '"Montserrat", sans-serif' }, { label: 'Comic Neue (Веселый)', value: '"Comic Neue", cursive' },
                { label: 'Roboto (Классика)', value: '"Roboto", sans-serif' }, { label: 'Open Sans (Читаемый)', value: '"Open Sans", sans-serif' },
                { label: 'Oswald (Вытянутый)', value: '"Oswald", sans-serif' }, { label: 'Raleway (Элегантный)', value: '"Raleway", sans-serif' },
                { label: 'Nunito (Мягкий)', value: '"Nunito", sans-serif' }, { label: 'Playfair Display (С засечками)', value: '"Playfair Display", serif' },
                { label: 'Caveat (Рукописный)', value: '"Caveat", cursive' }, { label: 'Rubik (Квадратный)', value: '"Rubik", sans-serif' },
                { label: 'Pacifico (Ретро)', value: '"Pacifico", cursive' }, { label: 'Yanone Kaffeesatz (Узкий)', value: '"Yanone Kaffeesatz", sans-serif' },
                { label: 'Comfortaa (Округлый)', value: '"Comfortaa", sans-serif' }, { label: 'Ruslan Display (Славянский)', value: '"Ruslan Display", cursive' },
                { label: 'Kelly Slab (Брутальный)', value: '"Kelly Slab", cursive' }, { label: 'Roboto Slab (Строгий)', value: '"Roboto Slab", serif' },
                { label: 'Lobster (Праздничный)', value: '"Lobster", cursive' }, { label: 'Alice (Книжный)', value: '"Alice", serif' },
                { label: 'PT Sans (Универсальный)', value: '"PT Sans", sans-serif' }, { label: 'Impact (Мемный)', value: 'Impact, sans-serif' }
            ];

            return (
                <div className="flex h-screen bg-slate-950 font-sans text-slate-200">
                    <div className="w-72 bg-slate-900 border-r border-slate-800 flex flex-col z-20 shadow-2xl relative shrink-0">
                        <div className="p-6 border-b border-slate-800 flex items-center gap-3 drag-region">
                            <span className="text-3xl drop-shadow-md select-none">⚡</span>
                            <h1 className="text-2xl font-black bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400 tracking-tight">TIKTIMER</h1>
                        </div>
                        <nav className="flex-1 py-4 flex flex-col gap-1 no-drag">
                            <TabBtn id="connect" icon="fa-solid fa-wifi" text="Подключения" />
                            <TabBtn id="multiplayer" icon="fa-solid fa-users" text="Мультиплеер" />
                            <TabBtn id="timer" icon="fa-solid fa-clock" text="Лайки, Время, Подписки" />
                            <TabBtn id="buffs" icon="fa-solid fa-bolt" text="Триггеры" />
                            <TabBtn id="roulette" icon="fa-solid fa-dice" text="Рулетки" />
                            <TabBtn id="style" icon="fa-solid fa-palette" text="Оформление" />
                        </nav>
                        <div className="p-4 border-t border-slate-800 no-drag space-y-3">
                            <div className="bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                                <div className="flex justify-between items-center mb-2">
                                    <span className="text-xs font-bold text-slate-400 uppercase"><i className="fa-solid fa-volume-high mr-1 text-indigo-400"></i> Звуки</span>
                                    <span className="text-xs font-bold text-white bg-slate-900 px-2 py-0.5 rounded border border-slate-700">{Math.round(volume * 100)}%</span>
                                </div>

                                            <div className="font-black tabular-nums transition-all mt-4 z-10 relative"
                                                style={{ 
                                                    fontFamily: config.styles.fontFamily, 
                                                    color: config.styles.timerColor,
                                                    textShadow: getStroke(true, config.styles.enableStroke !== false, `0px 10px 40px ${hexToRgba(config.styles.timerColor, config.styles.timerGlow !== undefined ? config.styles.timerGlow : 0.4)}, 0px 0px 60px ${hexToRgba(config.styles.timerColor, (config.styles.timerGlow !== undefined ? config.styles.timerGlow : 0.4) * 0.75)}`),
                                                    fontSize: `5rem`
                                                }}>
                                                00:15:00
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            )}

                        </div>
                    </div>
                    
                    {}
                    {hasChanges && (
                        <div id="save-bar" className="absolute top-6 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur-md border border-indigo-500/50 p-2 rounded-full shadow-[0_10px_40px_rgba(0,0,0,0.8)] flex items-center gap-2 z-50 animate-fade-in-down-centered">
                            <button onClick={handleSave} className="w-12 h-12 flex items-center justify-center bg-emerald-600 hover:bg-emerald-500 rounded-full text-white shadow-[0_0_15px_rgba(16,185,129,0.5)] transition group" title="Сохранить">
                                <i className="fa-solid fa-check text-2xl group-hover:scale-110 transition-transform"></i>
                            </button>
                            <button onClick={handleCancel} className="w-12 h-12 flex items-center justify-center bg-slate-700 hover:bg-rose-500 rounded-full text-white transition shadow-md group" title="Отменить">
                                <i className="fa-solid fa-xmark text-2xl group-hover:scale-110 transition-transform"></i>
                            </button>
                        </div>
                    )}

                    <GiftModal isOpen={modal.isOpen} onClose={() => setModal({ isOpen: false, key: null })} onSelect={(gift) => {
                        if (modal.key.startsWith('custom_')) {
                            const id = modal.key.split('_')[1];
                            setConfig(p => ({...p, customGifts: p.customGifts.map(cg => cg.id === id ? { ...cg, gift } : cg)}));
                        } else if (modal.key.startsWith('addRouletteGift_')) {
                            const rId = modal.key.split('_')[1];
                            setConfig(p => ({
                                ...p, 
                                roulettes: p.roulettes.map(r => r.id === rId ? { ...r, triggerGifts: [...(r.triggerGifts || []), gift] } : r)
                            }));
                        } else if (modal.key.startsWith('penalty_')) {
                            const id = modal.key.split('_')[1];
                            setConfig(p => ({...p, penalties: p.penalties.map(x => x.id === id ? { ...x, gift } : x)}));
                        } else { 
                            setConfig({ ...config, [modal.key]: gift }); 
                        }
                    }} />

                </div>
            );
        }

        function LicenseManager({ children, viewMode }) {
            const [machineId, setMachineId] = useState(null);
            const [isLicensed, setIsLicensed] = useState(true); 
            const [isLoading, setIsLoading] = useState(true);
            const [copied, setCopied] = useState(false);

            const checkLicense = async () => {
                setIsLoading(true);
                try {
                    let mId = machineId;
                    if (!mId) {
                        mId = await ipcRenderer.invoke('get-machine-id');
                        setMachineId(mId);
                    }

                    const { data, error } = await supabase
                        .from('app_licenses')
                        .select('is_active')
                        .eq('machine_id', mId)
                        .single();

                    if (error && error.code === 'PGRST116') {
                        await supabase.from('app_licenses').insert([{ machine_id: mId, is_active: true }]);
                        setIsLicensed(true);
                        localStorage.removeItem('marfaleyBanned');
                    } else if (data) {
                        setIsLicensed(data.is_active);
                        if (!data.is_active) {
                            localStorage.setItem('marfaleyBanned', 'true');
                        } else {
                            localStorage.removeItem('marfaleyBanned');
                        }
                    } else if (error) {
                        if (localStorage.getItem('marfaleyBanned') === 'true') {
                            setIsLicensed(false);
                        }
                    }
                } catch (e) {
                    console.error("Ошибка проверки лицензии:", e);
                    if (localStorage.getItem('marfaleyBanned') === 'true') {
                        setIsLicensed(false);
                    }
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => {
                checkLicense();
            }, []);

            useEffect(() => {
                if (!machineId || !isLicensed) return;

                const handleTrackStream = async (e, { username }) => {
                    if (!username) return;
                    try {
                        const { data } = await supabase.from('app_licenses').select('connected_usernames').eq('machine_id', machineId).single();
                        let current = data?.connected_usernames || [];
                        if (!Array.isArray(current)) current = [];
                        
                        if (!current.includes(username)) {
                            current.push(username);
                            await supabase.from('app_licenses').update({ connected_usernames: current }).eq('machine_id', machineId);
                        }
                    } catch (err) { console.error("Ошибка обновления истории аккаунтов:", err); }
                };

                let pendingCoins = 0;
                let isSyncing = false;

                const handleTrackCoins = (e, { amount }) => {
                    pendingCoins += amount;
                };

                ipcRenderer.on('track-stream', handleTrackStream);
                ipcRenderer.on('track-coins', handleTrackCoins);

                const syncInterval = setInterval(async () => {
                    if (pendingCoins > 0 && !isSyncing) {
                        isSyncing = true;
                        const coinsToSync = pendingCoins;
                        pendingCoins = 0; 
                        try {
                            const { data } = await supabase.from('app_licenses').select('total_coins').eq('machine_id', machineId).single();
                            const newTotal = Number(data?.total_coins || 0) + coinsToSync;
                            await supabase.from('app_licenses').update({ total_coins: newTotal }).eq('machine_id', machineId);
                        } catch (err) {
                            pendingCoins += coinsToSync; 
                        } finally {
                            isSyncing = false;
                        }
                    }
                }, 15000); 

                return () => {
                    ipcRenderer.removeListener('track-stream', handleTrackStream);
                    ipcRenderer.removeListener('track-coins', handleTrackCoins);
                    clearInterval(syncInterval);
                };
            }, [machineId, isLicensed]);

            if (isLoading) {
                return (
                    <div className="h-screen w-screen bg-slate-950 flex flex-col items-center justify-center p-8 z-[9999] relative drag-region">
                        <i className="fa-solid fa-circle-notch fa-spin text-indigo-500 text-6xl mb-4"></i>
                        <h2 className="text-xl font-bold text-white">Проверка лицензии...</h2>
                    </div>
                );
            }

            if (!isLicensed) {
                return (
                    <div className="h-screen w-screen bg-slate-950 flex flex-col items-center justify-center p-8 z-[9999] relative drag-region">
                        <div className="bg-slate-900 border border-rose-500/50 p-8 rounded-3xl shadow-[0_0_50px_rgba(244,63,94,0.2)] max-w-2xl text-center no-drag">
                            <i className="fa-solid fa-lock text-rose-500 text-6xl mb-6"></i>
                            <h1 className="text-3xl font-black text-white mb-4 uppercase">Доступ ограничен</h1>
                            <p className="text-slate-300 text-lg mb-6">Вы используете программу без лицензии или ваш доступ был приостановлен.</p>
                            
                            <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 mb-8 inline-block text-left w-full">
                                <p className="text-sm text-slate-400 uppercase font-bold mb-3">Свяжитесь с разработчиком для получения лицензии:</p>
                                <div className="flex flex-col gap-3">
                                    <a href="#" onClick={(e) => { e.preventDefault(); require('electron').shell.openExternal('https://t.me/jacobdeads')}} className="flex items-center gap-3 text-white hover:text-indigo-400 transition">
                                        <i className="fa-brands fa-telegram text-2xl text-blue-500"></i>
                                        <span className="font-bold text-xl">⚡𝔙𝔏𝔄𝔇ℑ𝔎</span>
                                    </a>
                                    <a href="#" onClick={(e) => { e.preventDefault(); require('electron').shell.openExternal('https://www.tiktok.com/@nneensi0')}} className="flex items-center gap-3 text-white hover:text-rose-400 transition">
                                        <i className="fa-brands fa-tiktok text-2xl"></i>
                                        <span className="font-bold text-xl">⚡𝕾𝕿𝕽𝕰𝕬𝕸</span>
                                    </a>
                                </div>
                                
                                <div className="mt-6 pt-6 border-t border-slate-800">
                                    <p className="text-sm text-slate-400 uppercase font-bold mb-2">Ваш уникальный ID:</p>
                                    <div className="flex items-center gap-2 bg-slate-900 border border-slate-700 p-3 rounded-xl">
                                        <code className="flex-1 font-mono text-indigo-300 text-lg select-all overflow-hidden text-ellipsis">{machineId || 'Загрузка...'}</code>
                                        <button 
                                            onClick={() => {
                                                navigator.clipboard.writeText(machineId);
                                                setCopied(true);
                                                setTimeout(() => setCopied(false), 2000);
                                            }} 
                                            className={`w-12 h-12 flex shrink-0 items-center justify-center rounded-xl transition-all ${copied ? 'bg-emerald-600 scale-105' : 'bg-slate-800 hover:bg-indigo-600'}`}
                                            title="Скопировать ID"
                                        >
                                            <i className={`fa-solid text-xl ${copied ? 'fa-check text-white' : 'fa-copy text-slate-300'}`}></i>
                                        </button>
                                    </div>
                                    {copied && <p className="text-emerald-400 text-xs mt-2 font-bold text-center transition-opacity">ID успешно скопирован в буфер обмена!</p>}
                                </div>
                            </div>
                            
                            <button onClick={checkLicense} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition flex items-center justify-center gap-3 text-lg shadow-lg">
                                <i className="fa-solid fa-arrows-rotate"></i> Обновить статус
                            </button>
                        </div>
                    </div>
                );
            }

            return children;
        }

        const rootComponent = (
            <LicenseManager>
                <MainView />
            </LicenseManager>
        );
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(rootComponent);
    </script>
</body>
</html>
