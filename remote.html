<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пульт</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        
        body { 
            background-color: #0f172a; 
            color: #f8fafc; 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            margin: 0;
            padding: 0;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        
        .drag-region { -webkit-app-region: drag; user-select: none; }
        .no-drag { -webkit-app-region: no-drag; }

        @keyframes progress-shimmer {
            0% { background-position: 0 0; }
            100% { background-position: 40px 0; }
        }
        .animate-progress-shimmer {
            background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.15) 75%, transparent 75%, transparent);
            background-size: 40px 40px;
            animation: progress-shimmer 1s linear infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { ipcRenderer } = require('electron');

        const formatTime = (totalSeconds) => {
            const h = Math.floor(Math.abs(totalSeconds) / 3600);
            const m = Math.floor((Math.abs(totalSeconds) % 3600) / 60);
            const s = Math.abs(totalSeconds) % 60;
            return `${totalSeconds < 0 ? '-' : ''}${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        };

        function RemoteApp() {
            const [state, setState] = useState({ timeLeft: 0, isFrozen: false, freezeTimeLeft: 0, currentTotalLikes: 0, isReversed: false }); 
            const [customSeconds, setCustomSeconds] = useState(60); 
            const [history, setHistory] = useState([]);
            const [tops, setTops] = useState({ coins: [], likes: [] });
            
            const [activeTab, setActiveTab] = useState('controls'); 
            const [historyFilter, setHistoryFilter] = useState('all'); 
            const [topTab, setTopTab] = useState('coins'); 
            
            const [config, setConfig] = useState(() => JSON.parse(localStorage.getItem('marfaleyConfig') || '{}'));
            const [ttStatus, setTtStatus] = useState(null);

            useEffect(() => { 
                ipcRenderer.on('settings-updated', (e, cfg) => setConfig(cfg));
                ipcRenderer.on('timer-tick', (e, s) => setState(s)); 
                ipcRenderer.on('new-alert', (e, data) => { setHistory(prev => [data, ...prev].slice(0, 100)); });
                ipcRenderer.on('top-update', (e, data) => setTops(data));
                ipcRenderer.on('tiktok-status', (e, data) => setTtStatus(data));

                ipcRenderer.send('request-tops');
                ipcRenderer.send('get-initial-status');

                return () => { 
                    ipcRenderer.removeAllListeners('timer-tick'); 
                    ipcRenderer.removeAllListeners('new-alert'); 
                    ipcRenderer.removeAllListeners('settings-updated'); 
                    ipcRenderer.removeAllListeners('top-update');
                    ipcRenderer.removeAllListeners('tiktok-status');
                }; 
            }, []);

            const streamerName = ttStatus?.nickname && ttStatus?.nickname !== 'Стример' ? ttStatus.nickname : (config.username || 'Стример');
            const streamerAvatar = ttStatus?.avatar && !ttStatus?.avatar.includes('1055823.png') ? ttStatus.avatar : 'https://cdn-icons-png.flaticon.com/512/1055/1055823.png';

            const logRemoteAction = (actionName, timeValue, typeName) => {
                const newAlert = {
                    id: Date.now() + Math.random(),
                    username: streamerName,
                    avatar: streamerAvatar,
                    giftName: actionName,
                    timeAdded: timeValue,
                    type: typeName || 'remote_action',
                    isSpecial: true,
                    isFromRemote: true 
                };
                setHistory(prev => [newAlert, ...prev].slice(0, 100));
            };

            // Локальные действия (не генерируют алерт на сервере, пишем сами)
            const handleManualAdd = (sec) => { ipcRenderer.send('manual-add', sec, streamerName, streamerAvatar); logRemoteAction(`Добавлено +${sec} сек`, sec, 'remote_action'); };
            const handleManualSub = (sec) => { ipcRenderer.send('manual-sub', sec, streamerName, streamerAvatar); logRemoteAction(`Убавлено -${sec} сек`, -sec, 'remote_action'); };
            const handleManualFreeze = () => { ipcRenderer.send('manual-freeze', streamerName, streamerAvatar); logRemoteAction('Активирована заморозка', 0, 'freeze'); };
            const handleManualUnfreeze = () => { ipcRenderer.send('manual-unfreeze', streamerName, streamerAvatar); logRemoteAction('Снята заморозка', 0, 'unfreeze'); };
            const handleManualReverse = () => { ipcRenderer.send('manual-reverse', streamerName, streamerAvatar); logRemoteAction(state.isReversed ? 'Обычный ход времени' : 'Разворот времени', 0, 'reverse_time'); };
            
            // Серверные действия (генерируют алерт на бэкенде). Передаем данные стримера.
            const handleTriggerRoulette = (rId, rName) => { ipcRenderer.send('manual-trigger-roulette', rId, streamerName, streamerAvatar); };
            const handleRuiner = () => { ipcRenderer.send('manual-ruiner', streamerName, streamerAvatar); };
            const handleSave = () => { ipcRenderer.send('manual-save', streamerName, streamerAvatar); };

            // ИНТЕЛЛЕКТУАЛЬНАЯ ПРОВЕРКА НА ПУЛЬТ: 
            // Если событие инициировал сам стример (через пульт), мы перехватываем его здесь
            const checkIsRemote = (h) => {
                return h.isFromRemote === true || 
                       (h.username === streamerName && ['ruiner', 'save', 'roulette', 'special'].includes(h.type));
            };

            const filteredHistory = history.filter(h => {
                const isRemote = checkIsRemote(h);
                
                if (historyFilter === 'all') return true;
                if (historyFilter === 'remote') return isRemote;
                
                if (isRemote) return false; // Скрываем действия пульта из остальных вкладок, чтобы не мусорить
                
                const mainType = h.type; 
                const origType = h.originalType; 
                
                if (historyFilter === 'social') return mainType === 'like' || mainType === 'follow' || origType === 'like' || origType === 'follow';
                if (historyFilter === 'roulettes') return mainType === 'roulette' || mainType === 'special' || mainType === 'swap_time';
                if (historyFilter === 'gifts') return !['like', 'follow', 'roulette', 'special', 'swap_time'].includes(mainType) && !['like', 'follow'].includes(origType);
                return true;
            });

            return (
                <div className="p-5 h-screen bg-slate-900 flex flex-col items-center no-drag drag-region text-white overflow-hidden">
                    <h2 className="text-slate-400 font-bold mb-3 tracking-widest uppercase text-xs">Пульт Управления</h2>
                    
                    <div className="text-6xl font-black mb-2 drop-shadow-[0_0_15px_rgba(255,255,255,0.3)] shrink-0">{formatTime(state.timeLeft)}</div>
                    
                    {state.isFrozen && (
                        <div className="bg-cyan-500/20 border border-cyan-500/50 text-cyan-400 font-bold px-4 py-1 rounded-full text-sm mb-4 animate-pulse shrink-0 shadow-[0_0_15px_rgba(6,182,212,0.3)]">
                            ❄️ ЗАМОРОЖЕНО ({state.freezeTimeLeft} сек)
                        </div>
                    )}
                    
                    {state.isReversed && (
                        <div className="bg-pink-500/20 border border-pink-500/50 text-pink-400 font-bold px-4 py-1 rounded-full text-sm mb-4 animate-pulse shrink-0 shadow-[0_0_15px_rgba(219,39,119,0.3)]">
                            🔄 ВРЕМЯ ИДЕТ ВПЕРЕД
                        </div>
                    )}

                    <div className="w-full flex bg-slate-950 p-1 rounded-xl border border-slate-800 mb-4 shrink-0 no-drag">
                        <button
                            className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 ${activeTab === 'controls' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}
                            onClick={() => setActiveTab('controls')}
                        >
                            <i className="fa-solid fa-gamepad"></i> Управление
                        </button>
                        <button
                            className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 ${activeTab === 'history' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}
                            onClick={() => setActiveTab('history')}
                        >
                            <i className="fa-solid fa-clock-rotate-left"></i> История
                        </button>
                        <button
                            className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-2 ${activeTab === 'top' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}
                            onClick={() => setActiveTab('top')}
                        >
                            <i className="fa-solid fa-trophy"></i> ТОП
                        </button>
                    </div>

                    <div className="w-full flex-1 flex flex-col overflow-hidden no-drag">
                        
                        {/* --- ВКЛАДКА УПРАВЛЕНИЯ --- */}
                        {activeTab === 'controls' && (
                            <div className="flex-1 overflow-y-auto custom-scrollbar flex flex-col pb-2 pr-1">
                                
                                {(config.roulettes || []).filter(r => r.triggerType === 'like' || r.triggerType === 'both').map(r => {
                                    const threshold = r.likesThreshold || 100000;
                                    const target = ((Math.floor((state.currentTotalLikes || 0) / threshold) + 1) * threshold);
                                    const remaining = Math.max(0, target - (state.currentTotalLikes || 0));
                                    const percent = Math.min(100, Math.max(0, (((state.currentTotalLikes || 0) % threshold) / threshold) * 100));
                                    
                                    return (
                                        <div key={`progress_${r.id}`} className="w-full mb-4 shrink-0 bg-slate-800/50 p-3 rounded-xl border border-slate-700 shadow-inner">
                                            <div className="flex justify-between items-end mb-2">
                                                <span className="text-[10px] text-slate-400 font-bold uppercase tracking-wider truncate mr-2"><i className="fa-solid fa-heart text-rose-500 mr-1 animate-pulse"></i> {r.name}</span>
                                                <span className="text-xs font-black text-rose-400 whitespace-nowrap">{remaining.toLocaleString()} до цели</span>
                                            </div>
                                            <div className="w-full h-3 bg-slate-900 rounded-full overflow-hidden border border-slate-700 relative">
                                                <div className="h-full bg-gradient-to-r from-rose-600 to-purple-600 animate-progress-shimmer transition-all duration-500" style={{ width: `${percent}%` }}></div>
                                            </div>
                                            <div className="flex justify-between mt-1">
                                                <span className="text-[10px] text-slate-500 font-bold">Текущие: {(state.currentTotalLikes || 0).toLocaleString()}</span>
                                                <span className="text-[10px] text-slate-500 font-bold">Цель: {target.toLocaleString()}</span>
                                            </div>
                                        </div>
                                    );
                                })}

                                <div className="w-full mb-4 shrink-0">
                                    <label className="text-xs text-slate-400 font-bold uppercase mb-1 block">Быстрые кнопки (Мин)</label>
                                    <div className="grid grid-cols-4 gap-2 mb-4">
                                        <button className="bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white border border-emerald-500/30 rounded-lg py-1 text-xs font-black transition" onClick={() => handleManualAdd(60)}>+1</button>
                                        <button className="bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white border border-emerald-500/30 rounded-lg py-1 text-xs font-black transition" onClick={() => handleManualAdd(300)}>+5</button>
                                        <button className="bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white border border-emerald-500/30 rounded-lg py-1 text-xs font-black transition" onClick={() => handleManualAdd(600)}>+10</button>
                                        <button className="bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white border border-emerald-500/30 rounded-lg py-1 text-xs font-black transition" onClick={() => handleManualAdd(1800)}>+30</button>
                                        
                                        <button className="bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white border border-rose-500/30 rounded-lg py-1 text-xs font-black transition" onClick={() => handleManualSub(60)}>-1</button>
                                        <button className="bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white border border-rose-500/30 rounded-lg py-1 text-xs font-black transition" onClick={() => handleManualSub(300)}>-5</button>
                                        <button className="bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white border border-rose-500/30 rounded-lg py-1 text-xs font-black transition" onClick={() => handleManualSub(600)}>-10</button>
                                        <button className="bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white border border-rose-500/30 rounded-lg py-1 text-xs font-black transition" onClick={() => handleManualSub(1800)}>-30</button>
                                    </div>

                                    <label className="text-xs text-slate-400 font-bold uppercase mb-1 block">Кастомное время (сек)</label>
                                    <input type="number" value={customSeconds} onChange={e => setCustomSeconds(Number(e.target.value))} className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 font-black text-xl text-center outline-none focus:border-indigo-500 mb-2" />
                                    <div className="grid grid-cols-2 gap-2">
                                        <button className="bg-emerald-600 hover:bg-emerald-500 py-2 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2" onClick={() => handleManualAdd(customSeconds)}><i className="fa-solid fa-plus"></i> Добавить</button>
                                        <button className="bg-rose-600 hover:bg-rose-500 py-2 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2" onClick={() => handleManualSub(customSeconds)}><i className="fa-solid fa-minus"></i> Убавить</button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 mt-2">
                                        <button className="bg-cyan-600 hover:bg-cyan-500 py-2 rounded-xl text-sm font-bold transition flex items-center justify-center gap-1.5" onClick={handleManualFreeze}><i className="fa-solid fa-snowflake"></i> + Заморозка</button>
                                        <button className="bg-orange-600 hover:bg-orange-500 py-2 rounded-xl text-sm font-bold transition flex items-center justify-center gap-1.5" onClick={handleManualUnfreeze}><i className="fa-solid fa-fire"></i> - Разморозка</button>
                                        <button className="bg-pink-600 hover:bg-pink-500 py-2 rounded-xl text-sm font-bold transition flex items-center justify-center gap-1.5 col-span-2 shadow-[0_0_15px_rgba(219,39,119,0.4)]" onClick={handleManualReverse}><i className="fa-solid fa-clock-rotate-left"></i> {state.isReversed ? 'Обычный ход времени' : 'Развернуть время'}</button>
                                    </div>
                                    <div className="text-center text-[10px] text-slate-500 font-bold uppercase mt-3 mb-1 border-t border-slate-800 pt-2"></div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button className="bg-orange-600 hover:bg-orange-500 py-2 rounded-xl text-sm font-bold transition flex items-center justify-center gap-1.5" onClick={handleRuiner}><i className="fa-solid fa-burst"></i> Руинер</button>
                                        <button className="bg-amber-500 hover:bg-amber-400 text-slate-900 py-2 rounded-xl text-sm font-bold transition flex items-center justify-center gap-1.5 shadow-[0_0_15px_rgba(245,158,11,0.4)]" onClick={handleSave}><i className="fa-solid fa-shield"></i> Сейв</button>
                                    </div>
                                </div>
                                
                                <div className="flex flex-col gap-2 w-full shrink-0 mt-4 border-t border-slate-800 pt-3">
                                    <button className="bg-indigo-600 hover:bg-indigo-500 p-2 text-sm rounded-xl font-bold transition" onClick={() => ipcRenderer.send('toggle-timer')}>СТАРТ / ПАУЗА</button>
                                    
                                    <div className="text-center text-[10px] text-slate-500 font-bold uppercase mt-2 mb-1">Запуск рулеток</div>
                                    {(config.roulettes || []).map(r => (
                                        <button key={`trigger_${r.id}`} className="bg-purple-600 hover:bg-purple-500 p-2 text-xs rounded-xl font-bold transition truncate" onClick={() => handleTriggerRoulette(r.id, r.name)} title={r.name}>
                                            {r.name.toUpperCase()}
                                        </button>
                                    ))}
                                    {(!config.roulettes || config.roulettes.length === 0) && (
                                        <div className="bg-slate-800 text-slate-500 p-2 text-xs rounded-xl font-bold text-center">НЕТ РУЛЕТОК</div>
                                    )}
                                </div>
                            </div>
                        )}
                        
                        {/* --- ВКЛАДКА ИСТОРИИ --- */}
                        {activeTab === 'history' && (
                            <div className="flex-1 flex flex-col overflow-hidden">
                                <div className="grid grid-cols-5 gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 mb-2 shrink-0">
                                    <button onClick={() => setHistoryFilter('all')} className={`py-1.5 text-[10px] font-bold rounded-lg transition-all ${historyFilter === 'all' ? 'bg-slate-700 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>Все</button>
                                    <button onClick={() => setHistoryFilter('social')} className={`py-1.5 text-[10px] font-bold rounded-lg transition-all ${historyFilter === 'social' ? 'bg-rose-600/80 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>Соц.</button>
                                    <button onClick={() => setHistoryFilter('gifts')} className={`py-1.5 text-[10px] font-bold rounded-lg transition-all ${historyFilter === 'gifts' ? 'bg-emerald-600/80 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>Донат</button>
                                    <button onClick={() => setHistoryFilter('roulettes')} className={`py-1.5 text-[10px] font-bold rounded-lg transition-all ${historyFilter === 'roulettes' ? 'bg-purple-600/80 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>Рулетки</button>
                                    <button onClick={() => setHistoryFilter('remote')} className={`py-1.5 text-[10px] font-bold rounded-lg transition-all ${historyFilter === 'remote' ? 'bg-indigo-600/80 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>Пульт</button>
                                </div>
                                
                                <div className="flex-1 overflow-y-auto bg-slate-950 rounded-xl p-2 border border-slate-800 flex flex-col gap-2 custom-scrollbar">
                                    {filteredHistory.length === 0 && <span className="text-slate-600 text-sm text-center mt-4">Событий нет</span>}
                                    {filteredHistory.map((h) => {
                                        const isRemote = checkIsRemote(h);
                                        const t = h.type;
                                        let actionLabel = '';
                                        
                                        // ОПТИМИЗАЦИЯ ТЕКСТА: Добавлено чтение названия рулетки
                                        if (t === 'roulette') {
                                            const rName = h.rouletteName || 'Рулетка';
                                            actionLabel = isRemote ? `Пульт (${rName})` : rName;
                                        }
                                        else if (t === 'ruiner') actionLabel = isRemote ? 'Пульт (Руинер)' : 'Руинер';
                                        else if (t === 'save') actionLabel = isRemote ? 'Пульт (Сейв)' : 'СЕЙВ';
                                        else if (t === 'freeze') actionLabel = 'Заморозка';
                                        else if (t === 'unfreeze') actionLabel = 'Разморозка';
                                        else if (t === 'reverse_time') actionLabel = 'Разворот';
                                        else if (t === 'frozen_gift') actionLabel = 'Заморожен';
                                        else if (t === 'multiplier') actionLabel = 'Бафф';
                                        else if (t === 'debuff') actionLabel = 'Дебафф';
                                        else if (t === 'penalty') actionLabel = 'Отнять до порога';
                                        else if (t === 'set_time' || t === 'set') actionLabel = '= Время';
                                        else if (t === 'reset_time' || t === 'reset') actionLabel = 'Обнуление';
                                        else if (isRemote) actionLabel = 'Пульт';

                                        let eventName = h.giftName || 'Событие';
                                        if (h.type === 'like') eventName = `За ${h.amount || 'лайки'} лайков`;
                                        else if (h.type === 'follow') eventName = 'Подписка';
                                        else if (h.amount > 1 && !h.isSpecial) eventName = `${eventName} (x${h.amount})`;

                                        // Добавляем отображение выпавшей позиции для рулеток
                                        if ((h.type === 'roulette' || h.type === 'special') && h.positionName) {
                                            eventName = `${eventName}: ${h.positionName}`;
                                        }

                                        const isAttackSent = eventName.includes('АТАКА НА');
                                        const isAttackReceived = eventName.startsWith('ОТ ');

                                        // Если это атака, принудительно добавляем позицию или предмет из рулетки
                                        if (isAttackSent || isAttackReceived) {
                                            if (h.positionName) {
                                                eventName = `${eventName} ➔ [${h.positionName}]`;
                                            } else if (h.rouletteName) {
                                                eventName = `${eventName} ➔ [${h.rouletteName}]`;
                                            }
                                        }

                                        let displayTime = '';
                                        let timeColorClass = 'text-slate-300';
                                        
                                        if (h.timeAdded > 0) {
                                            displayTime = '+' + h.timeAdded + ' сек';
                                            timeColorClass = 'text-emerald-400';
                                        } else if (h.timeAdded < 0) {
                                            displayTime = h.timeAdded + ' сек';
                                            timeColorClass = 'text-rose-400';
                                        } else {
                                            if (isAttackSent) {
                                                displayTime = '⚔️ В АТАКУ';
                                                timeColorClass = 'text-rose-500';
                                            } else if (isAttackReceived) {
                                                displayTime = '🛡️ ПОЛУЧЕНО';
                                                timeColorClass = 'text-orange-400';
                                            } else if (t === 'freeze' || t === 'unfreeze') {
                                                displayTime = '❄️ ЭФФЕКТ';
                                                timeColorClass = 'text-cyan-400';
                                            } else if (t === 'save') {
                                                displayTime = '🛡️ ЗАЩИТА';
                                                timeColorClass = 'text-amber-400';
                                            } else if (t === 'multiplier') {
                                                displayTime = '⚡ БАФФ';
                                                timeColorClass = 'text-amber-400';
                                            } else if (t === 'debuff') {
                                                displayTime = '☠️ ДЕБАФФ';
                                                timeColorClass = 'text-purple-400';
                                            } else if (isRemote) {
                                                displayTime = '✅ ПРИМЕНЕНО';
                                                timeColorClass = 'text-indigo-400';
                                            } else {
                                                displayTime = '0 сек';
                                            }
                                        }

                                        return (
                                        <div key={h.id} className={`flex items-center gap-3 bg-slate-900 p-2 rounded-lg border ${isRemote ? 'border-indigo-500/50 shadow-[0_0_15px_rgba(99,102,241,0.15)]' : 'border-slate-800'} shrink-0 transition-all`}>
                                            <img src={h.avatar || 'https://via.placeholder.com/32'} className={`w-8 h-8 rounded-full border ${isRemote ? 'border-indigo-500 shadow-[0_0_10px_rgba(99,102,241,0.4)]' : 'border-slate-700'} bg-slate-800 object-cover`} />
                                            <div className="flex flex-col flex-1 overflow-hidden">
                                                <span className={`text-sm font-bold truncate ${isRemote ? 'text-indigo-300' : 'text-white'}`}>{h.username || 'Аноним'}</span>
                                                <span className="text-xs text-slate-400 truncate flex items-center gap-1">
                                                    {eventName}
                                                </span>
                                            </div>
                                            <div className="flex flex-col items-end shrink-0 ml-2">
                                                <span className={`text-sm font-black whitespace-nowrap ${timeColorClass}`}>
                                                    {displayTime}
                                                </span>
                                                {actionLabel && (
                                                    <span className={`text-[10px] font-bold uppercase ${h.timeAdded < 0 || t === 'debuff' || t === 'penalty' ? 'text-rose-500' : t === 'save' || t === 'ruiner' ? 'text-amber-400' : isRemote ? 'text-indigo-400' : 'text-slate-400'}`}>
                                                        {actionLabel}
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    )})}
                                </div>
                            </div>
                        )}

                        {/* --- ВКЛАДКА ТОПОВ --- */}
                        {activeTab === 'top' && (
                            <div className="flex-1 flex flex-col overflow-hidden">
                                <div className="grid grid-cols-2 gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 mb-2 shrink-0">
                                    <button onClick={() => setTopTab('coins')} className={`py-2 text-[11px] font-bold rounded-lg transition-all flex items-center justify-center gap-2 ${topTab === 'coins' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'text-slate-400 hover:bg-slate-800'}`}><i className="fa-solid fa-coins"></i> Донатеры</button>
                                    <button onClick={() => setTopTab('likes')} className={`py-2 text-[11px] font-bold rounded-lg transition-all flex items-center justify-center gap-2 ${topTab === 'likes' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'text-slate-400 hover:bg-slate-800'}`}><i className="fa-solid fa-heart"></i> Лайкеры</button>
                                </div>

                                <div className="flex-1 overflow-y-auto bg-slate-950 rounded-xl p-2 border border-slate-800 flex flex-col gap-2 custom-scrollbar relative">
                                    {topTab === 'coins' && tops.coins.length === 0 && <span className="text-slate-600 text-sm text-center mt-10">Топ донатеров пуст</span>}
                                    {topTab === 'likes' && tops.likes.length === 0 && <span className="text-slate-600 text-sm text-center mt-10">Топ лайкеров пуст</span>}
                                    
                                    {(topTab === 'coins' ? tops.coins : tops.likes).map((user, i) => (
                                        <div key={user.username} className="flex items-center gap-3 bg-slate-900 p-3 rounded-lg border border-slate-800 shrink-0 relative overflow-hidden group">
                                            {i === 0 && <div className="absolute top-0 right-0 w-16 h-16 bg-gradient-to-bl from-amber-400/20 to-transparent -mr-8 -mt-8 rotate-45 pointer-events-none"></div>}
                                            
                                            <div className="w-6 font-black text-slate-500 text-center shrink-0">
                                                {i === 0 ? <i className="fa-solid fa-crown text-amber-400 text-xl"></i> : 
                                                 i === 1 ? <i className="fa-solid fa-medal text-slate-300 text-lg"></i> :
                                                 i === 2 ? <i className="fa-solid fa-medal text-orange-400 text-lg"></i> : 
                                                 `#${i + 1}`}
                                            </div>

                                            <img src={user.avatar || 'https://via.placeholder.com/32'} className={`w-10 h-10 rounded-full object-cover shrink-0 ${i === 0 ? 'border-2 border-amber-400 shadow-[0_0_10px_rgba(251,191,36,0.5)]' : 'border border-slate-700'}`} />
                                            
                                            <div className="flex flex-col flex-1 overflow-hidden">
                                                <span className={`text-sm font-bold truncate ${i === 0 ? 'text-amber-400' : 'text-white'}`}>{user.username}</span>
                                            </div>
                                            
                                            <div className="flex items-center gap-1.5 font-black text-lg bg-slate-950 px-2 py-1 rounded-md border border-slate-800">
                                                <span className={topTab === 'coins' ? 'text-amber-400' : 'text-rose-400'}>{user.amount.toLocaleString()}</span>
                                                {topTab === 'coins' ? <i className="fa-solid fa-coins text-amber-500 text-xs"></i> : <i className="fa-solid fa-heart text-rose-500 text-xs"></i>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RemoteApp />);
    </script>
</body>
</html>
